name: R03 K source-bound contracts
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-k-sourcecheck.yml'
      - 'Tools/AssemblyShadow/R03/**'
      - 'Tools/AssemblyShadow/R03IR/**'
      - 'Tools/AssemblyShadow/R03Storage/**'
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tools/AssemblyShadow/R03/
            /Tools/AssemblyShadow/R03IR/
            /Tools/AssemblyShadow/R03Storage/
      - name: K contracts, native transport and exact source hashes
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          OUT="$RUNNER_TEMP/k-check"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-sha.txt"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for root in ('Tools/AssemblyShadow/R03','Tools/AssemblyShadow/R03IR'):
              for p in sorted(Path(root).glob('*.py')):
                  ast.parse(p.read_text(),filename=str(p))
          print('Python source syntax Passed')
          PY
          python3 -B -m unittest discover -s Tools/AssemblyShadow/R03IR -p 'test_*.py' -v > "$OUT/unittest.log" 2>&1 || { tail -120 "$OUT/unittest.log"; exit 1; }
          tail -12 "$OUT/unittest.log"
          R03_SANITIZERS=1 python3 -B -m unittest discover -s Tools/AssemblyShadow/R03IR -p 'test_native_snapshot.py' -v > "$OUT/native-sanitized.log" 2>&1 || { cat "$OUT/native-sanitized.log"; exit 1; }
          cat "$OUT/native-sanitized.log"
          git diff --check
          git diff --exit-code
      - name: Bind original source and exact logs
        if: always()
        shell: python
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'k-check';out.mkdir(exist_ok=True)
          names=['Tools/AssemblyShadow/R03IR/PlayerProject/R03TerminalPlayer.cs',
                 'Tools/AssemblyShadow/R03/PlayerProject/AssemblyShadowR03Probe.cpp',
                 'Tools/AssemblyShadow/R03/PlayerProject/R03Build.cs',
                 'Tools/AssemblyShadow/R03IR/run_terminal_local.py',
                 'Tools/AssemblyShadow/R03IR/run_terminal_storage_checked.py',
                 'Tools/AssemblyShadow/R03IR/bee_observation.py',
                 'Tools/AssemblyShadow/R03IR/test_k_contracts.py',
                 'Tools/AssemblyShadow/R03IR/test_native_snapshot.py']
          rows=[{'path':p,'blob':subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip(),
                 'sha256':hashlib.sha256(Path(p).read_bytes()).hexdigest()} for p in names]
          files=[{'name':x.name,'bytes':x.stat().st_size,'sha256':hashlib.sha256(x.read_bytes()).hexdigest()} for x in out.iterdir() if x.is_file()]
          (out/'provenance.json').write_text(json.dumps({'head':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
             'sources':rows,'files':files,'actualUnityRun':False,'runtimeAcceptance':False},indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-k-sourcecheck-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/k-check
          retention-days: 14
          if-no-files-found: warn
