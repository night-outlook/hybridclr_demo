name: R03 L factory and receipt contracts
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-l-contracts.yml'
      - 'Tools/AssemblyShadow/R03/PlayerProject/**'
      - 'Tools/AssemblyShadow/R03IR/**'
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tools/AssemblyShadow/
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.318'
      - name: Run all current IR tests and actual snapshot sanitizer control
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          OUT="$RUNNER_TEMP/r03-l"
          mkdir "$OUT"
          python3 -B -m unittest discover -s Tools/AssemblyShadow/R03IR -p 'test_*.py' -v > "$OUT/host.log" 2>&1 || { tail -100 "$OUT/host.log"; exit 1; }
          R03_SANITIZERS=1 python3 -B -m unittest discover -s Tools/AssemblyShadow/R03IR -p test_native_snapshot.py -v > "$OUT/sanitized.log" 2>&1
          tail -10 "$OUT/host.log"
          git diff --check
          git diff --exit-code
      - name: Bind source and log identities
        if: always()
        shell: python
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'r03-l';out.mkdir(exist_ok=True)
          names=['Tools/AssemblyShadow/R03/PlayerProject/R03Build.cs','Tools/AssemblyShadow/R03IR/bee_observation.py','Tools/AssemblyShadow/R03IR/test_factory_observation.py','Tools/AssemblyShadow/R03IR/test_k_contracts.py']
          sources=[{'path':p,'sha256':hashlib.sha256(Path(p).read_bytes()).hexdigest(),'blob':subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()} for p in names]
          files=[{'path':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in out.iterdir() if p.is_file()]
          (out/'provenance.json').write_text(json.dumps({'head':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'sources':sources,'files':files,'scope':'Actual managed factory lease, synthetic registry; host native snapshot. No Unity Editor','runtimeAcceptance':False},indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-l-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/r03-l
          retention-days: 14
          if-no-files-found: error
