name: R03 IR side-effect fixture and S compatibility
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-ir-fixture.yml'
      - 'Tools/AssemblyShadow/R03/PlayerFixtures/Program.cs'
      - 'Tools/AssemblyShadow/R03/Fixtures/EvolutionFixtureCorpus.cs'
      - 'Tools/AssemblyShadow/R03/PlayerFixtures/PlayerFixtures.csproj'
      - 'Tools/AssemblyShadow/R03IR/current_native_generator_receipt.py'
      - 'Tools/AssemblyShadow/R03IR/current_native_generator_receipt_contracts.py'
      - 'Tools/AssemblyShadow/R03IR/run_terminal_local.py'
      - 'Tools/AssemblyShadow/R03IR/run_terminal_current.py'
      - 'Tools/AssemblyShadow/R03IR/current_native_environment_admission.py'
      - 'Tools/AssemblyShadow/R03IR/run_current_native_validation_cycle.py'
      - 'Docs/AssemblyShadow/Handoff/WEB_TO_LOCAL.md'
permissions:
  contents: read
jobs:
  original-and-ir:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hybridclr_demo
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Tools/AssemblyShadow/R03/PlayerFixtures
            Tools/AssemblyShadow/R03/Fixtures/EvolutionFixtureCorpus.cs
            Tools/AssemblyShadow/R03/HostTests/EnvironmentBoundaries.cs
            Tools/AssemblyShadow/R03/source-pins.json
            Tools/AssemblyShadow/R03IR/current_native_generator_receipt.py
            Tools/AssemblyShadow/R03IR/current_native_generator_receipt_contracts.py
      - name: Exact required HybridCLR Unity revision
        id: package
        shell: python
        run: |
          import json,os,re
          from pathlib import Path
          data=json.loads(Path('hybridclr_demo/Tools/AssemblyShadow/R03/source-pins.json').read_text())
          assert re.fullmatch('[0-9a-f]{40}',data['hybridclr_unity'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+data['hybridclr_unity']+'\n')
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_unity
          ref: ${{ steps.package.outputs.sha }}
          path: hybridclr_unity
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Plugins/dnlib.dll
            Editor/AssemblyShadow/Model/ShadowConfiguration.cs
            Editor/AssemblyShadow/Metadata/AssemblyIdentityUtil.cs
            Editor/AssemblyShadow/Metadata/EvolutionSignature.cs
            Editor/AssemblyShadow/Metadata/LogicalMethodIdentity.cs
            Editor/AssemblyShadow/Metadata/NativeLayoutAdmissionValidator.cs
            Editor/AssemblyShadow/Metadata/NativeLayoutIdentityContext.cs
            Editor/AssemblyShadow/Hashing/CanonicalSignatureWriter.cs
            Tests/Editor/AssemblyShadow/R03EvolutionContractCases.cs
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.318'
      - name: Sixteen adversarial generator receipt tests (synthetic, no Unity)
        shell: bash
        run: python3 -B hybridclr_demo/Tools/AssemblyShadow/R03IR/current_native_generator_receipt_contracts.py
      - name: Build exact new IR fixture generator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r03-ir-fixture"
          dotnet build hybridclr_demo/Tools/AssemblyShadow/R03/PlayerFixtures/PlayerFixtures.csproj \
            -c Release -v minimal \
            -p:PackageRoot="$GITHUB_WORKSPACE/hybridclr_unity" \
            -p:BaseIntermediateOutputPath="$RUNNER_TEMP/r03-ir-fixture/obj/" \
            -p:OutputPath="$RUNNER_TEMP/r03-ir-fixture/bin/" \
            --disable-build-servers -p:UseSharedCompilation=false -nodeReuse:false \
            2>&1 | tee "$RUNNER_TEMP/r03-ir-fixture/build.log"
      - name: Generate original 15 and new IR target in separate fresh roots
        shell: bash
        run: |
          set -euo pipefail
          dotnet "$RUNNER_TEMP/r03-ir-fixture/bin/PlayerFixtures.dll" \
            --output "$RUNNER_TEMP/r03-ir-fixture/original" > "$RUNNER_TEMP/r03-ir-fixture/original.stdout.json"
          dotnet "$RUNNER_TEMP/r03-ir-fixture/bin/PlayerFixtures.dll" \
            --ir-target "$RUNNER_TEMP/r03-ir-fixture/ir" > "$RUNNER_TEMP/r03-ir-fixture/ir.stdout.json"
          dotnet "$RUNNER_TEMP/r03-ir-fixture/bin/PlayerFixtures.dll" \
            --ir-target "$RUNNER_TEMP/r03-ir-fixture/ir-repeat" > "$RUNNER_TEMP/r03-ir-fixture/ir-repeat.stdout.json"
          set +e
          dotnet "$RUNNER_TEMP/r03-ir-fixture/bin/PlayerFixtures.dll" \
            --ir-target "$RUNNER_TEMP/r03-ir-fixture/ir" \
            > "$RUNNER_TEMP/r03-ir-fixture/duplicate.stdout.log" \
            2> "$RUNNER_TEMP/r03-ir-fixture/duplicate.stderr.log"
          duplicate_exit=$?
          set -e
          echo "$duplicate_exit" > "$RUNNER_TEMP/r03-ir-fixture/duplicate.exit"
          test "$duplicate_exit" -ne 0
      - name: Bind pinned IR bytes, MVID and independently repeated generator output
        shell: bash
        run: |
          set -euo pipefail
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R03IR/current_native_generator_receipt.py \
            --original "$RUNNER_TEMP/r03-ir-fixture/original/inventory.json" \
            --first "$RUNNER_TEMP/r03-ir-fixture/ir" \
            --repeat "$RUNNER_TEMP/r03-ir-fixture/ir-repeat" \
            > "$RUNNER_TEMP/r03-ir-fixture/pinned-target-verdict.json"
      - name: Bind exact historical S fixture inventory and byte hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'r03-ir-fixture'
          original=json.loads((root/'original/inventory.json').read_text())
          url=('https://raw.githubusercontent.com/night-outlook/hybridclr_demo/'
               'fc55d8b8ce1738fda465c06cd97dc2a8f95ce34b/'
               'Docs/AssemblyShadow/History/M07R/R03/'
               'local-validation-20261007-batch-s-evidence-ready/batch/host/player-fixtures/inventory.json')
          with urllib.request.urlopen(url,timeout=60) as response: historical=response.read()
          blob=hashlib.sha1(('blob '+str(len(historical))+'\0').encode()+historical).hexdigest()
          assert blob=='0688bd2dad054bd59fcdd1564a050a398cfa14e7',blob
          expected=json.loads(historical)
          assert len(original['files'])==len(expected['files'])==15
          actual_by={row['path']:row for row in original['files']}
          expected_by={row['path']:row for row in expected['files']}
          assert set(actual_by)==set(expected_by)
          differences=[]
          for path in sorted(actual_by):
            observed, historical=actual_by[path],expected_by[path]
            generated_bytes=(root/'original'/path).read_bytes()
            assert observed['sha256']==hashlib.sha256(generated_bytes).hexdigest()
            assert observed['size']==len(generated_bytes)
            # Regenerated DLLs are intentionally NOT source authority. Their
            # MVID and serialized bytes may differ from immutable S originals.
            # The graph and layout input shape still must be compatible.
            for key in ('path','assembly','references','size'):
              assert observed.get(key)==historical.get(key), (path,key)
            differing={key:{'current':observed.get(key),'originalS':historical.get(key)}
                       for key in sorted(set(observed)|set(historical))
                       if observed.get(key)!=historical.get(key)}
            if differing: differences.append({'path':path,'differences':differing})
          print('ORIGINAL_S_FIXTURE_DIFFERENCES='+json.dumps(differences,sort_keys=True))
          comparison={'result':'PassedStructuralComparison_BinaryIdentityNotClaimed',
            'originalSInventoryGitBlob':blob,'generatedOriginalCount':15,
            'matchedPathAssemblyRefsAndSize':15,'differentByteOrMvidCount':len(differences),
            'differences':differences,'historicalSBytesReplaced':False,
            'historicalSBytesRebuiltForLocal':False,'historicalSArchiveAuthenticatedHere':False,
            'runtimeAcceptance':False}
          (root/'historical-differences.json').write_text(json.dumps(
            comparison,indent=2)+'\n')
          # Verify actual artifact bytes, not merely an in-memory JSON object.
          artifact=(root/'historical-differences.json')
          emitted=artifact.read_bytes()
          assert emitted.endswith(b'\n') and not emitted.endswith(b'\\n')
          assert json.loads(emitted)==comparison
          assert len(json.loads(emitted)['differences'])==len(differences)
          target=json.loads((root/'ir/ir-target.json').read_text())
          data=(root/'ir/Methods.dll').read_bytes()
          assert target['kind']=='R03IRSideEffectFixture'
          strict=json.loads((root/'pinned-target-verdict.json').read_text())
          assert strict['result']=='PassedPinnedFreshGeneratorBytesAndRepeatability_HostOnly'
          assert strict['first']['sha256']=='8d0b28cbca4d889801883ad436c51c215b913f1645055590980f902f1e80fffd'
          assert strict['first']['mvid']=='597eb18e-e0e7-6f8b-7e4a-6cdaabf9d1ff'
          assert strict['first']==strict['repeat']
          assert strict['R03Accepted'] is False
          assert target['layoutEditorAdmission']=='Passed'
          assert target['sideEffectInstructionsVerified'] is True
          assert target['originalSFixtureUnchanged'] is True
          assert target['runtimeAcceptance'] is False
          assert target['sha256']==hashlib.sha256(data).hexdigest()
          assert target['size']==len(data)
          original_target=next(f for f in original['files'] if f['path']=='virtual-slot/Methods.dll')
          assert target['sha256'] != original_target['sha256']
          report={'kind':'R03IRFixtureCompatibility','result':'PassedSourceAndHostOnly',
            'source':os.environ['GITHUB_SHA'],'historicalSBlob':blob,'regeneratedOriginalFixtures':15,
            'regeneratedOriginalMatchesHistoricalSBySourceShapeOnly':True,
            'regeneratedOriginalSBytesAdopted':False,
            'regeneratedOriginalSHistoricalByteIdentity':False,
            'originalSByteDifferences':len(differences),
            'irTargetSha256':target['sha256'],'originalTargetSha256':original_target['sha256'],
            'editorLayoutAdmission':'Passed','runtimeAcceptance':False,'playerRun':False,
            'preservesOriginalS':True}
          (root/'verified.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
          git -C hybridclr_demo diff --exit-code
          git -C hybridclr_unity diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-ir-fixture-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/r03-ir-fixture/build.log
            ${{ runner.temp }}/r03-ir-fixture/original/inventory.json
            ${{ runner.temp }}/r03-ir-fixture/ir/ir-target.json
            ${{ runner.temp }}/r03-ir-fixture/verified.json
            ${{ runner.temp }}/r03-ir-fixture/pinned-target-verdict.json
            ${{ runner.temp }}/r03-ir-fixture/ir-repeat/ir-target.json
            ${{ runner.temp }}/r03-ir-fixture/duplicate.exit
            ${{ runner.temp }}/r03-ir-fixture/duplicate.stderr.log
            ${{ runner.temp }}/r03-ir-fixture/historical-differences.json
          retention-days: 14
          if-no-files-found: warn
