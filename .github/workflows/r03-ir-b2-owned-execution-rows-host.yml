name: R03 B2 owned nonempty execution-row staging (no Unity)
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - .github/workflows/r03-ir-b2-owned-execution-rows-host.yml
      - Tools/AssemblyShadow/R03IR/NativeDiagnostics/BoundedOwnedDefinitionTypeKey.h
      - Tools/AssemblyShadow/R03IR/NativeDiagnostics/BoundedOwnedConstructedTypeKey.h
      - Tools/AssemblyShadow/R03IR/NativeDiagnostics/BoundedOwnedExecutionRows.h
      - Tools/AssemblyShadow/R03IR/NativeDiagnostics/bounded_owned_execution_rows_driver.cpp
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-owned-rows:
    runs-on: ${{ matrix.os }}
    name: Owned class rows ${{ matrix.os }} ${{ matrix.std }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        std: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/NativeDiagnostics
      - name: Strict and sanitized C++ host execution
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          clang++ --version
          ROOT="Tools/AssemblyShadow/R03IR/NativeDiagnostics"
          shasum -a 256 "$ROOT/BoundedOwnedExecutionRows.h" \
            "$ROOT/BoundedOwnedDefinitionTypeKey.h" \
            "$ROOT/bounded_owned_execution_rows_driver.cpp"
          mkdir -p "$RUNNER_TEMP/r03-b2-owned-rows"
          for profile in strict sanitized; do
            FLAGS=(-std=${{ matrix.std }} -g -O1 -Wall -Wextra -Werror -pedantic)
            if [ "$profile" = sanitized ]; then
              FLAGS+=(-fsanitize=address,undefined -fno-omit-frame-pointer)
            fi
            clang++ "${FLAGS[@]}" "$ROOT/bounded_owned_execution_rows_driver.cpp" \
              -o "$RUNNER_TEMP/r03-b2-owned-rows/$profile"
            ASAN_OPTIONS="detect_leaks=0:abort_on_error=1" \
              UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1" \
              "$RUNNER_TEMP/r03-b2-owned-rows/$profile" \
              > "$RUNNER_TEMP/r03-b2-owned-rows/$profile.json"
            cat "$RUNNER_TEMP/r03-b2-owned-rows/$profile.json"
            python3 -B - "$RUNNER_TEMP/r03-b2-owned-rows/$profile.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding='utf8'))
          assert j['kind']=='R03B2OwnedExecutionRowsHost'
          assert j['result']=='PassedOwnedNonemptyRowsOnly'
          assert j['assertions']>=50
          assert j['protectedAllocations']==0
          assert j['realPhysicalClassOriginProven'] is False
          assert j['canonicalGenericExecutionTypeKeysComplete'] is False
          assert j['fullFinalExecutionDiagnostics'] is False
          assert j['nativeV2TransportImplemented'] is False
          assert j['runtimeAcceptance'] is False
          PY
          done
          echo "Pure owned primitive row staging only; live VM field15 incomplete"
