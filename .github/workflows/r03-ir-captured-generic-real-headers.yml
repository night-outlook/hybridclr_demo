name: R03 captured generic native probe real IL2CPP header syntax
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - '.github/workflows/r03-ir-captured-generic-real-headers.yml'
      - 'Tools/AssemblyShadow/R03IR/PlayerProject/R03CapturedGenericPhysicalProbe.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-headers:
    name: Pinned il2cpp_plus real header C++11 syntax / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: hybridclr_demo
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tools/AssemblyShadow/R03IR/PlayerProject/R03CapturedGenericPhysicalProbe.cpp
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/il2cpp_plus
          ref: 41764ae1eeefb33b05966e7f7676e52aae39c340
          path: il2cpp_plus
          persist-credentials: false
          sparse-checkout: |
            libil2cpp
      - name: Real native fork headers, no test-double API substitution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C hybridclr_demo rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C il2cpp_plus rev-parse HEAD)" = 41764ae1eeefb33b05966e7f7676e52aae39c340
          src="$GITHUB_WORKSPACE/hybridclr_demo/Tools/AssemblyShadow/R03IR/PlayerProject/R03CapturedGenericPhysicalProbe.cpp"
          native="$GITHUB_WORKSPACE/il2cpp_plus/libil2cpp"
          temp="$RUNNER_TEMP/r03-captured-actual-headers"
          mkdir -p "$temp/generated/hybridclr/generated"
          # The fork stores UnityVersion.h only in generated SDK output.
          # This test stub is a VERSION MACRO ONLY, not an IL2CPP API mock.
          printf '#pragma once\n#define HYBRIDCLR_UNITY_VERSION 20220362\n' \
            > "$temp/generated/hybridclr/generated/UnityVersion.h"
          compiler="$(command -v clang++ || command -v g++)"
          test -n "$compiler"
          "$compiler" -std=c++11 -fsyntax-only \
            -DHYBRIDCLR_R03_RUNTIME_PROBE=1 \
            -DHYBRIDCLR_ENABLE_ASSEMBLY_SHADOW=1 \
            -I"$temp/generated" -I"$native" -I"$native/pch" \
            "$src"
          echo 'Real pinned fork API headers compile. This is NOT Unity/Player/link evidence.'
