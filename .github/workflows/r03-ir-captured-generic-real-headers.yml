name: R03 captured generic exact public native fork API source audit
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - '.github/workflows/r03-ir-captured-generic-real-headers.yml'
      - 'Tools/AssemblyShadow/R03IR/PlayerProject/R03CapturedGenericPhysicalProbe.cpp'
      - 'Tools/AssemblyShadow/R03IR/real_native_header_surface.py'
      - 'Tools/AssemblyShadow/R03IR/test_real_native_header_surface.py'
      - 'Docs/AssemblyShadow/Handoff/WEB_TO_LOCAL.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-fork-source:
    name: Authentic pinned fork declarations (source only) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hybridclr_demo
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tools/AssemblyShadow/R03IR/PlayerProject/R03CapturedGenericPhysicalProbe.cpp
            /Tools/AssemblyShadow/R03IR/real_native_header_surface.py
            /Tools/AssemblyShadow/R03IR/test_real_native_header_surface.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/il2cpp_plus
          ref: 41764ae1eeefb33b05966e7f7676e52aae39c340
          path: il2cpp_plus
          persist-credentials: false
          sparse-checkout: |
            libil2cpp
      - name: Actual pinned fork API declaration and implementation audit
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          test "$(git -C hybridclr_demo rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C il2cpp_plus rev-parse HEAD)" = 41764ae1eeefb33b05966e7f7676e52aae39c340
          export R03_FORK_ROOT="$GITHUB_WORKSPACE/il2cpp_plus"
          export R03_CAPTURED_PROBE="$GITHUB_WORKSPACE/hybridclr_demo/Tools/AssemblyShadow/R03IR/PlayerProject/R03CapturedGenericPhysicalProbe.cpp"
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R03IR/real_native_header_surface.py \
            --fork "$R03_FORK_ROOT" --probe "$R03_CAPTURED_PROBE"
          python3 -B -m unittest discover \
            -s hybridclr_demo/Tools/AssemblyShadow/R03IR \
            -p test_real_native_header_surface.py -v
          echo 'PUBLIC FORK SOURCE DECLARATIONS ONLY: no vendor Unity SDK/Baselib,'
          echo 'no native translation-unit compilation, no Unity/Player/IL2CPP, no error15.'
