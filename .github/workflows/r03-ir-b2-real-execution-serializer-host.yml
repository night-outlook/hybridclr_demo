name: R03 B2 real native execution serializer bridge (host only)
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - .github/workflows/r03-ir-b2-real-execution-serializer-host.yml
      - Tools/AssemblyShadow/R03IR/NativeDiagnostics/BoundedOwnedDefinitionTypeKey.h
      - Tools/AssemblyShadow/R03IR/NativeDiagnostics/BoundedOwnedExecutionRows.h
      - Tools/AssemblyShadow/R03IR/NativeDiagnostics/BoundedOwnedExecutionSerializerBridge.h
      - Tools/AssemblyShadow/R03IR/NativeDiagnostics/bounded_execution_serializer_bridge_driver.cpp
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-native-serializer:
    name: Execution row serializer ${{ matrix.os }} ${{ matrix.std }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        std: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          path: demo
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/NativeDiagnostics
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: 8aa8d09319a89b55b2496bcc2c69ccc69cb57be9
          path: native
          filter: blob:none
          sparse-checkout: |
            libil2cpp/vm
      - name: Actual serializer header and fixed sink against original legacy ostream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C native rev-parse HEAD)" = "8aa8d09319a89b55b2496bcc2c69ccc69cb57be9"
          git -C demo rev-parse HEAD
          clang++ --version
          SRC="demo/Tools/AssemblyShadow/R03IR/NativeDiagnostics"
          INC="native/libil2cpp"
          shasum -a 256 "$INC/vm/AssemblyShadowExecutionSerializer.h" \
            "$INC/vm/AssemblyShadowDiagnosticWriter.h" \
            "$SRC/BoundedOwnedDefinitionTypeKey.h" \
            "$SRC/BoundedOwnedExecutionRows.h" \
            "$SRC/BoundedOwnedExecutionSerializerBridge.h" \
            "$SRC/bounded_execution_serializer_bridge_driver.cpp"
          mkdir -p "$RUNNER_TEMP/r03-b2-native-exec-serializer"
          for profile in strict sanitized; do
            FLAGS=(-std=${{ matrix.std }} -g -O1 -Wall -Wextra -Werror -pedantic)
            if [ "$profile" = sanitized ]; then
              FLAGS+=(-fsanitize=address,undefined -fno-omit-frame-pointer)
            fi
            clang++ "${FLAGS[@]}" -I"$INC" \
              "$SRC/bounded_execution_serializer_bridge_driver.cpp" \
              -o "$RUNNER_TEMP/r03-b2-native-exec-serializer/$profile"
            ASAN_OPTIONS="detect_leaks=0:abort_on_error=1" \
              UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1" \
              "$RUNNER_TEMP/r03-b2-native-exec-serializer/$profile" \
              > "$RUNNER_TEMP/r03-b2-native-exec-serializer/$profile.json"
            cat "$RUNNER_TEMP/r03-b2-native-exec-serializer/$profile.json"
            python3 -B - "$RUNNER_TEMP/r03-b2-native-exec-serializer/$profile.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding='utf8'))
          assert j['kind']=='R03B2RealNativeExecutionSerializerHost'
          assert j['result']=='PassedOwnedRowsToNativeSerializerOnly'
          assert j['assertions']>=20 and j['protectedAllocations']==0
          assert j['sourceBytesFromRealVm'] is False
          assert j['completeNonemptyExecutionDiagnostics'] is False
          assert j['runtimeAcceptance'] is False
          assert j['nativeV2TransportImplemented'] is False
          PY
          done
          echo "Owned rows share actual native serializer; metadata/VM source not proven"
