name: R03 captured-generic physical native A2 host C++11 contracts
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - '.github/workflows/r03-ir-captured-generic-native-host.yml'
      - 'Tools/AssemblyShadow/R03IR/NativeDiagnostics/test_captured_generic_physical_probe.py'
      - 'Tools/AssemblyShadow/R03IR/PlayerProject/R03CapturedGenericPhysicalProbe.cpp'
      - 'Docs/AssemblyShadow/Handoff/WEB_TO_LOCAL.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-native-test-source:
    name: C++11 actual probe and negative VM-shaped host / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tools/AssemblyShadow/R03IR/NativeDiagnostics/test_captured_generic_physical_probe.py
            /Tools/AssemblyShadow/R03IR/PlayerProject/R03CapturedGenericPhysicalProbe.cpp
      - name: Compile exact A2 source under C++11 and reject forged host states
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m unittest discover \
            -s Tools/AssemblyShadow/R03IR/NativeDiagnostics \
            -p test_captured_generic_physical_probe.py -v
          echo 'VM-shaped native host only; Unity/IL2CPP/real guard/error15 NotRun'
