name: R03 immutable source capture
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths: ['.github/workflows/r03-source-capture.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/il2cpp_plus
          ref: aae0ebb55b8761a7a905b410349d006d76fa748b
          path: il2cpp_plus
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr
          ref: 4b2774b066cfc6afd77a8c8aded6bda7ea574f55
          path: hybridclr
          persist-credentials: false
      - name: Preserve exact Git-tracked source bytes for Primary analysis
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,shutil,hashlib,json
          out=Path(os.environ['RUNNER_TEMP'])/'source-capture';out.mkdir()
          pins={}
          for repo in ('il2cpp_plus','hybridclr'):
              pins[repo]=subprocess.check_output(['git','-C',repo,'rev-parse','HEAD'],text=True).strip()
              for name in subprocess.check_output(['git','-C',repo,'ls-files','-z']).decode().split('\0'):
                  if not name:continue
                  p=Path(repo)/name
                  if p.is_file():
                      target=out/p;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,target)
          files=[{'path':str(p.relative_to(out)),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file()]
          (out/'provenance.json').write_text(json.dumps({'kind':'ReadOnlySourceCapture','sources':pins,'files':files,'runtimeAcceptance':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r03-lf-source-capture
          path: ${{ runner.temp }}/source-capture
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
