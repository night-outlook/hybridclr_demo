name: Runtime01 Primary exact source snapshot
on:
  push:
    branches: [codex/connector-smoke-20261010-runtime01-9f53]
    paths: ['.github/workflows/runtime01-reconcile-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_demo
          ref: ec904d3eedf69035d301040ecd81a4137576757f
          path: hybridclr_demo
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            Tools/AssemblyShadow
            Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/IR_RUNTIME_01_2026-10-10
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/il2cpp_plus
          ref: 5df6a01bfee2fe63b28fa45d8720571858c0f589
          path: il2cpp_plus
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr
          ref: 4b2774b066cfc6afd77a8c8aded6bda7ea574f55
          path: hybridclr
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_unity
          ref: 948c0e3b4f8891481301770115e8ba4945eea6de
          path: hybridclr_unity
          persist-credentials: false
      - name: Authenticate tracked snapshot bytes
        shell: python
        run: |
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          pins={'hybridclr_demo':'ec904d3eedf69035d301040ecd81a4137576757f','il2cpp_plus':'5df6a01bfee2fe63b28fa45d8720571858c0f589','hybridclr':'4b2774b066cfc6afd77a8c8aded6bda7ea574f55','hybridclr_unity':'948c0e3b4f8891481301770115e8ba4945eea6de'}
          rows=[];out=Path(os.environ['RUNNER_TEMP'])/'snapshot';out.mkdir()
          with zipfile.ZipFile(out/'sources.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for repo,pin in pins.items():
                  root=Path(repo)
                  head=subprocess.check_output(['git','-C',repo,'rev-parse','HEAD']).decode().strip()
                  assert head==pin
                  for entry in subprocess.check_output(['git','-C',repo,'ls-files','-s','-z']).split(b'\0'):
                      if not entry:continue
                      metadata,raw=entry.split(b'\t',1);mode,blob,stage=metadata.decode().split();path=raw.decode()
                      if repo=='hybridclr_demo' and not path.startswith(('.github/workflows/','Tools/AssemblyShadow/','Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/IR_RUNTIME_01_2026-10-10/')):continue
                      p=root/path
                      if mode not in ('100644','100755') or not p.is_file() or p.is_symlink():continue
                      data=p.read_bytes();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob
                      z.writestr(repo+'/'+path,data)
                      rows.append({'repository':repo,'path':path,'gitBlob':blob,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
                  subprocess.run(['git','-C',repo,'diff','--exit-code'],check=True)
              z.writestr('SOURCE_BINDINGS.json',json.dumps({'pins':pins,'files':rows,'unityRun':False,'purpose':'Primary read-only source snapshots, not Local handoff or runtime evidence'},indent=2)+'\n')
          print('snapshot files',len(rows),'zipSha256',hashlib.sha256((out/'sources.zip').read_bytes()).hexdigest())
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime01-reconcile-source
          path: ${{ runner.temp }}/snapshot/sources.zip
          retention-days: 7
          if-no-files-found: error
