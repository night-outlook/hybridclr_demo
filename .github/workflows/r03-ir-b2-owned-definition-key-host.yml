name: R03 B2 bounded owned definition TypeKey host (no Unity)
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - .github/workflows/r03-ir-b2-owned-definition-key-host.yml
      - Tools/AssemblyShadow/R03IR/NativeDiagnostics/BoundedOwnedDefinitionTypeKey.h
      - Tools/AssemblyShadow/R03IR/NativeDiagnostics/bounded_owned_definition_key_driver.cpp
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-typekey:
    runs-on: ${{ matrix.os }}
    name: Owned definition key ${{ matrix.os }} ${{ matrix.std }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        std: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/NativeDiagnostics
      - name: Exact original source, strict and ASan/UBSan host assertions
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          clang++ --version
          ROOT="Tools/AssemblyShadow/R03IR/NativeDiagnostics"
          SOURCE="$ROOT/bounded_owned_definition_key_driver.cpp"
          HEADER="$ROOT/BoundedOwnedDefinitionTypeKey.h"
          shasum -a 256 "$SOURCE" "$HEADER"
          mkdir -p "$RUNNER_TEMP/b2-typekey"
          for profile in strict sanitized; do
            FLAGS=(-std=${{ matrix.std }} -g -O1 -Wall -Wextra -Werror -pedantic)
            if [ "$profile" = sanitized ]; then
              FLAGS+=(-fsanitize=address,undefined -fno-omit-frame-pointer)
            fi
            clang++ "${FLAGS[@]}" "$SOURCE" -o "$RUNNER_TEMP/b2-typekey/$profile"
            ASAN_OPTIONS="detect_leaks=0:abort_on_error=1" \
              UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1" \
              "$RUNNER_TEMP/b2-typekey/$profile" > "$RUNNER_TEMP/b2-typekey/$profile.json"
            cat "$RUNNER_TEMP/b2-typekey/$profile.json"
            python3 -B - "$RUNNER_TEMP/b2-typekey/$profile.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding='utf8'))
          assert j['kind']=='R03B2BoundedOwnedDefinitionTypeKeyHost'
          assert j['result']=='PassedLimitedGrammarOnly'
          assert j['assertions'] >= 175
          assert j['protectedAllocations']==0
          assert j['physicalMetadataSourceProven'] is False
          assert j['completeNonemptyExecutionSource'] is False
          assert j['nativeV2TransportImplemented'] is False
          assert j['runtimeAcceptance'] is False
          PY
          done
          echo "Test-only TypeKey formatter passed; no VM-source or V2 acceptance"
