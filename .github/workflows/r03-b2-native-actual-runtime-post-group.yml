name: R03 B2 native bodies with actual Runtime after-group fault (NOT Unity)
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/NativeRegistryActualRuntimePostGroupHost.cpp
      - .github/workflows/r03-b2-native-actual-runtime-post-group.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-runtime-host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        standard: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: Tools/AssemblyShadow/R03IR/TypeDefCensus
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: cecf4b859d50b128e5c0fc6c90cd89e3a452b96a
          path: _native_pinned
          filter: blob:none
          sparse-checkout: |
            libil2cpp/vm/Assembly.cpp
            libil2cpp/vm/MetadataCache.cpp
            libil2cpp/vm/AssemblyShadow.cpp
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/hybridclr
          ref: 4b2774b066cfc6afd77a8c8aded6bda7ea574f55
          path: _hybridclr_pinned
          filter: blob:none
          sparse-checkout: |
            hybridclr/metadata/InterpreterMetadataIndexCodec.h
            hybridclr/metadata/InterpreterMetadataIndexRuntime.h
            hybridclr/metadata/InterpreterMetadataIndexRuntime.cpp
            hybridclr/metadata/AssemblyShadowBridge.h
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate and extract the unchanged native publication bodies
        shell: bash
        env:
          R03_B2_NATIVE_ROOT: ${{ github.workspace }}/_native_pinned
        run: |
          set -euo pipefail
          test "$(git -C "$R03_B2_NATIVE_ROOT" rev-parse HEAD)" = 'cecf4b859d50b128e5c0fc6c90cd89e3a452b96a'
          dir=Tools/AssemblyShadow/R03IR/TypeDefCensus
          python3 "$dir/test_extract_native_registry_publication.py" -v 2>&1 | tee "$RUNNER_TEMP/native-extract-tests.log"
          grep -q 'Ran 10 tests' "$RUNNER_TEMP/native-extract-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/native-extract-tests.log"
          if grep -E 'skipped=|FAILED|ERROR:' "$RUNNER_TEMP/native-extract-tests.log"; then exit 1; fi
          python3 "$dir/extract_native_registry_publication.py" --native-root "$R03_B2_NATIVE_ROOT" --output "$RUNNER_TEMP/NativeRegistryExactBodies.inc" --receipt "$RUNNER_TEMP/native-source.json"
          python3 - "$RUNNER_TEMP/native-source.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf8') as f: d=json.load(f)
          assert d['schema']=='R03B2ExactNativeRegistryExceptionalHostV1'
          assert d['bodyCount']==11
          assert d['generatedSha256']=='9c6a27315f0fecefb52b7c80c838ef4d870dbf7e1184be8e0d21402c26aa5b8c'
          assert d['nativeProductionModified'] is False and d['handoffAuthority']=='CLOSED_NO_LOCAL_EXECUTION'
          PY
          cat "$RUNNER_TEMP/native-source.json"
      - name: Authenticate pinned real Runtime/Codec and run source-host matrix
        shell: bash
        env:
          STANDARD: ${{ matrix.standard }}
        run: |
          set -euo pipefail
          root=_hybridclr_pinned
          test "$(git -C "$root" rev-parse HEAD)" = '4b2774b066cfc6afd77a8c8aded6bda7ea574f55'
          check_blob() {
            local path="$1" expected="$2"
            test "$(git -C "$root" rev-parse "HEAD:$path")" = "$expected"
            test "$(git -C "$root" hash-object "$path")" = "$expected"
          }
          check_blob hybridclr/metadata/InterpreterMetadataIndexCodec.h 2020d4e2da6dea8601525203e7ab307d21c40a73
          check_blob hybridclr/metadata/InterpreterMetadataIndexRuntime.h c39ac0f5a0c1ea93c55d51e04d25d31a71775260
          check_blob hybridclr/metadata/InterpreterMetadataIndexRuntime.cpp 509e357359a8912c05adac3434a7e71b3fc3f83c
          check_blob hybridclr/metadata/AssemblyShadowBridge.h 5340c0bf9e4c4c211b4379929f3f79133661505a
          mkdir -p "$RUNNER_TEMP/il2cpp-stub"
          printf '#pragma once\n#define HYBRIDCLR_ENABLE_ASSEMBLY_SHADOW 1\n' > "$RUNNER_TEMP/il2cpp-stub/il2cpp-config.h"
          if [[ "$RUNNER_OS" == macOS ]]; then cxx=clang++; extra_flags=(-Wall); else cxx=g++; extra_flags=(-Wall -Wno-error=maybe-uninitialized); fi
          host=Tools/AssemblyShadow/R03IR/TypeDefCensus/NativeRegistryActualRuntimePostGroupHost.cpp
          runtime="$root/hybridclr/metadata/InterpreterMetadataIndexRuntime.cpp"
          for profile in strict sanitized; do
            flags=(-O2)
            if [[ "$profile" == sanitized ]]; then flags=(-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer); fi
            "$cxx" -std="$STANDARD" "${flags[@]}" "${extra_flags[@]}" -Wextra -Werror -pedantic -pthread \
              -I "$RUNNER_TEMP" -I "$RUNNER_TEMP/il2cpp-stub" -I "$root" \
              "$host" "$runtime" -o "$RUNNER_TEMP/native-actual-runtime"
            for scenario in used-rejection precodec-false codec-unfinalized runtime-success post-group-throw; do
              ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
                "$RUNNER_TEMP/native-actual-runtime" "$scenario" > "$RUNNER_TEMP/result.json"
              cat "$RUNNER_TEMP/result.json"
              python3 - "$RUNNER_TEMP/result.json" "$scenario" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf8') as f:r=json.load(f)
          case=sys.argv[2]
          assert r['kind']=='R03B2NativeActualRuntimePostGroup'
          assert r['case']==case and r['result']=='PassedPinnedHostScenario'
          assert r['checks']>=15
          assert r['actualNativeBodiesCompiled'] is True
          assert r['actualRuntimeCodecCalled'] is (case in ('codec-unfinalized','runtime-success','post-group-throw'))
          assert r['exceptionAfterActualGroup'] is (case=='post-group-throw')
          assert r['nativeVmMocked'] is True and r['bridgeMocked'] is True
          for flag in ('nativeProductionModified','safeRecoveryProven','exceptionSafePublicationProven','realUnity','R03Accepted','H2Passed','ReadyForHumanReviewGate'): assert r[flag] is False,flag
          print('Exact native bodies plus real Runtime host scenario: PASS; NOT Unity')
          PY
            done
          done
