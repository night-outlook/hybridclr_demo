name: H1 Primary Bee Stage
on:
  push:
    branches:
      - codex/h1-primary-bee-inspect-33543
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply primary implementation
        if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
        run: |
          python3 .github/h1_primary_stage.py
          python3 .github/h1_primary_stage_fix3.py
          python3 .github/h1_primary_stage_fix4.py
      - name: Check patch
        if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
        run: git diff --check
      - name: Run focused portable regressions
        if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
        env:
          PYTHONPATH: ${{ github.workspace }}/Tools/AssemblyShadow
        run: >-
          python3 -m unittest -v
          Tools.AssemblyShadow.tests.test_h1_compiler_actions
          Tools.AssemblyShadow.tests.test_h1_pch_provenance
          Tools.AssemblyShadow.tests.test_h1_native_capture
          Tools.AssemblyShadow.tests.test_h1_apple_macro_domains
          Tools.AssemblyShadow.tests.test_h1_plan_stage_retention
      - name: Commit staged implementation
        if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
        shell: bash
        run: |
          git config user.name night-outlook
          git config user.email wangxingfred.night@outlook.com
          git add Assets/AssemblyShadowDemo/Editor/H1CompilerProvenance.cs
          git add Tools/AssemblyShadow/h1_compiler_actions.py
          git add Tools/AssemblyShadow/h1_pch_provenance.py
          git add Tools/AssemblyShadow/h1_native_capture.py
          git add Tools/AssemblyShadow/h1_pch_diagnose.py
          git add Tools/AssemblyShadow/verify-h1-compiler-provenance-strict.py
          git add Tools/AssemblyShadow/tests/test_h1_apple_macro_domains.py
          git add Tools/AssemblyShadow/tests/test_h1_plan_stage_retention.py
          git add Documents/AgentHandoff/primary-bee-fix-33543/STATIC_REVIEW.md
          git commit -m 'fix(h1): separate Apple Bee macro domains and retain plan failures [skip ci]'
          git push origin HEAD:codex/h1-primary-bee-inspect-33543
