name: R03 LK pinned generator inputs
on:
  push:
    branches: [codex/connector-smoke-r03-lk-20261004]
    paths: ['.github/workflows/r03-lk-toolchain.yml', 'Tools/AssemblyShadow/LKInvestigation/**']
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: Tools/AssemblyShadow/LKInvestigation
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4abd44f1fc6f81a75c76ae4975c28dd06a80b9f8
          path: hybridclr_demo
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_unity
          ref: c86cbf665f5fcb2137e5adf2960541ce492467a4
          path: hybridclr_unity
          persist-credentials: false
      - name: Extract pinned SDK without Editor execution
        shell: bash
        run: |
          curl --fail --location --proto '=https' --max-time 900 https://download.unity3d.com/download_unity/7670c08855a9/MacEditorInstallerArm64/Unity-2022.3.62f2.pkg -o "$RUNNER_TEMP/unity.pkg"
          echo '5d2575c1b10a2a9f1f89bf40631a6b9bec3628fe16ca5f2203720af7943a3f05  '"$RUNNER_TEMP/unity.pkg" | shasum -a 256 -c
          pkgutil --expand-full "$RUNNER_TEMP/unity.pkg" "$RUNNER_TEMP/expanded"
      - name: Actual source-generator and semantic investigation
        run: python3 -B Tools/AssemblyShadow/LKInvestigation/inspect.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-lk-tools-${{ github.sha }}
          path: ${{ runner.temp }}/lk-tools
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
