name: R03 SNAP01 bounded design contracts
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-snap01-bounded-design.yml'
      - 'Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/SNAP01_BOUNDED_DESIGN_f8a2/reference/**'
permissions:
  contents: read
jobs:
  design-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/SNAP01_BOUNDED_DESIGN_f8a2/reference/
      - name: Reference codec and native coordinator, no Unity
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/SNAP01_BOUNDED_DESIGN_f8a2/reference/run_checks.py \
            --output "$RUNNER_TEMP/snap01-design"
          git diff --check
          git diff --exit-code
      - name: Bind source and runner identity
        if: always()
        shell: python
        run: |
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'snap01-design'
          out.mkdir(exist_ok=True)
          (out/'CI_IDENTITY.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'runner':os.environ['RUNNER_OS'],'runtimeAcceptance':False,'unityLaunched':False},indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: snap01-design-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/snap01-design
          retention-days: 14
          if-no-files-found: warn
