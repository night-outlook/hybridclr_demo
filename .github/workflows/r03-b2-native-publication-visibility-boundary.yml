name: R03 B2 native publication visibility source contract (NOT Unity)
on:
  push:
    branches:
      - codex/assembly-shadow-r01b-h1
    paths:
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_native_publication_visibility_boundary.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/test_verify_native_publication_visibility_boundary.py
      - .github/workflows/r03-b2-native-publication-visibility-boundary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-native-publication-boundary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/TypeDefCensus
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: cecf4b859d50b128e5c0fc6c90cd89e3a452b96a
          path: _native_pinned
          filter: blob:none
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadow.cpp
            libil2cpp/vm/Assembly.cpp
            libil2cpp/vm/MetadataCache.cpp
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/hybridclr
          ref: 4b2774b066cfc6afd77a8c8aded6bda7ea574f55
          path: _hybridclr_pinned
          filter: blob:none
          sparse-checkout: |
            hybridclr/metadata/StagedAssembly.cpp
            hybridclr/metadata/InterpreterMetadataIndexRuntime.cpp
            hybridclr/metadata/InterpreterMetadataIndexCodec.h
            hybridclr/metadata/AssemblyShadowBridge.cpp
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact Git source mutation tests and emit fail-closed receipt
        shell: bash
        env:
          R03_B2_NATIVE_ROOT: ${{ github.workspace }}/_native_pinned
          R03_B2_HYBRIDCLR_ROOT: ${{ github.workspace }}/_hybridclr_pinned
        run: |
          set -euo pipefail
          test "$(git -C "$R03_B2_NATIVE_ROOT" rev-parse HEAD)" = 'cecf4b859d50b128e5c0fc6c90cd89e3a452b96a'
          test "$(git -C "$R03_B2_HYBRIDCLR_ROOT" rev-parse HEAD)" = '4b2774b066cfc6afd77a8c8aded6bda7ea574f55'
          tests=Tools/AssemblyShadow/R03IR/TypeDefCensus/test_verify_native_publication_visibility_boundary.py
          python3 "$tests" -v 2>&1 | tee "$RUNNER_TEMP/publication-test.log"
          if grep -E '(skipped=|^SKIP|FAILED|ERROR)' "$RUNNER_TEMP/publication-test.log"; then
            echo "No skips, fails or errors authorized" >&2
            exit 1
          fi
          python3 Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_native_publication_visibility_boundary.py \
            --native-root "$R03_B2_NATIVE_ROOT" \
            --hybridclr-root "$R03_B2_HYBRIDCLR_ROOT" \
            --output "$RUNNER_TEMP/publication-boundary.json"
          cat "$RUNNER_TEMP/publication-boundary.json"
          python3 - "$RUNNER_TEMP/publication-boundary.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf8') as f:r=json.load(f)
          assert r['schema']=='R03B2NativePublicationVisibilityBoundaryV1'
          assert r['result']=='PinnedNativeNormalReturnAndBridgeBoundaryOnly'
          assert r['pinnedNativeFiles']==3 and r['pinnedHybridclrFiles']==4
          assert r['handoffAuthority']=='CLOSED_NO_LOCAL_EXECUTION'
          for key in ('normalFalseReturnRollsBackPhysicalAndCliVectors',
                      'runtimeGroupRequiresCodecSuccess','vmBridgeRequiresActiveSnapshotMembership',
                      'usageLockTransferredAcrossCallbacks','nativeNormalFailureResetsValidated',
                      'sourceOnly'):
              assert r[key] is True,key
          for key in ('exceptionalExitRollsBackRegistriesProven',
                      'crossCallbackUsageLockExceptionSafe',
                      'unknownPostCodecOutcomeRecoverable','concurrentNativeVmReadersProven',
                      'classGcMetadataLifetimeProven','nativeProductionChanged',
                      'realUnity','R03Accepted','H2Passed','ReadyForHumanReviewGate'):
              assert r[key] is False,key
          print('Pinned native normal-return/VM gate lexical source witness PASS; NOT Unity')
          PY
