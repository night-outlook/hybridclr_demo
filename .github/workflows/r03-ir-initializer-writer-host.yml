name: R03 initializer observation writer host contracts
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-ir-initializer-writer-host.yml'
      - 'Tools/AssemblyShadow/R03IR/PlayerProject/R03InitializerObservationWriter.cpp'
      - 'Tools/AssemblyShadow/R03IR/verify_initializer_trace.py'
      - 'Tools/AssemblyShadow/R03IR/verify_initializer_recovery.py'
      - 'Tools/AssemblyShadow/R03IR/NativeDiagnostics/test_initializer_writer_host.py'
      - 'Tools/AssemblyShadow/R03IR/NativeDiagnostics/initializer_writer_driver.cpp'
      - 'Tools/AssemblyShadow/R03IR/NativeDiagnostics/InitializerHostInclude/**'
permissions:
  contents: read
jobs:
  native-writer-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/PlayerProject/R03InitializerObservationWriter.cpp
            Tools/AssemblyShadow/R03IR/NativeDiagnostics
            Tools/AssemblyShadow/R03IR/verify_initializer_trace.py
            Tools/AssemblyShadow/R03IR/verify_initializer_recovery.py
      - name: Build C++11 and run source-bound host negatives
        shell: bash
        run: |
          python3 -B -m unittest discover \
            -s Tools/AssemblyShadow/R03IR/NativeDiagnostics \
            -p test_initializer_writer_host.py -v
          echo "Host-only: no Unity or Player execution"
