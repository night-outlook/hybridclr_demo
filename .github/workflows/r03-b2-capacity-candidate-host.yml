name: R03 B2 storage candidates C++ host (NOT Unity or product)
on:
  push:
    branches:
      - codex/assembly-shadow-r01b-h1
    paths:
      - Tools/AssemblyShadow/R03IR/CapacityCandidates/**
      - .github/workflows/r03-b2-capacity-candidate-host.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity-storage-candidates:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        standard: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/CapacityCandidates
          sparse-checkout-cone-mode: true
      - name: Compile and test both inert storage models
        shell: bash
        env:
          STANDARD: ${{ matrix.standard }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cxx=clang++
          else
            cxx=g++
          fi
          cd Tools/AssemblyShadow/R03IR/CapacityCandidates
          for profile in strict sanitizer; do
            if [[ "$profile" == "sanitizer" ]]; then
              "$cxx" -std="$STANDARD" -Wall -Wextra -Werror -pedantic \
                -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
                TypeDefStorageCandidateHost.cpp -o "$RUNNER_TEMP/storage-candidates"
            else
              "$cxx" -std="$STANDARD" -Wall -Wextra -Werror -pedantic -O2 \
                TypeDefStorageCandidateHost.cpp -o "$RUNNER_TEMP/storage-candidates"
            fi
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
              UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              "$RUNNER_TEMP/storage-candidates" \
              > "$RUNNER_TEMP/r03-b2-storage-result.json"
            cat "$RUNNER_TEMP/r03-b2-storage-result.json"
            python3 - "$RUNNER_TEMP/r03-b2-storage-result.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f:
              r=json.load(f)
          assert r['kind']=='R03B2StorageCandidateHost'
          assert r['result']=='PassedSyntheticStorageOnly'
          assert r['capacity']==1024 and r['priorLiveCap']==128
          assert r['cases']>=18 and r['assertions']>=2500
          assert r['compactReservedBytes']<r['slabReservedBytes']
          assert r['compactArenaBudgetBytes']==32768
          assert r['realUnity'] is False and r['realMetadata'] is False
          assert r['integratedInB2'] is False
          assert r['runtimeAcceptance'] is False and r['R03Accepted'] is False
          assert r['ReadyForHumanReviewGate'] is False
          PY
          done
