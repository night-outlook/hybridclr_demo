name: R03 bounded V2 native file transactions
on:
  push:
    branches: [codex/v2-file-transaction-20261014-5a71]
permissions:
  contents: read
jobs:
  files:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: clang++
            label: linux-clang
          - os: ubuntu-24.04
            cxx: g++
            label: linux-gcc
          - os: macos-14
            cxx: clang++
            label: macos-clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tools/AssemblyShadow/R03IR/bounded_v2/
            /Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/SNAP01_BOUNDED_DESIGN_f8a2/reference/
      - name: Strict and sanitized native file round trips and failure controls
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B Tools/AssemblyShadow/R03IR/bounded_v2/run_transaction_tests.py \
            --repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/v2-files"
          git diff --check
          git diff --exit-code
      - name: Bind workflow source and exact evidence
        if: always()
        shell: python
        run: |
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'v2-files';out.mkdir(exist_ok=True)
          (out/'CI_IDENTITY.json').write_text(json.dumps({'sourceCommit':os.environ['GITHUB_SHA'], 'runId':os.environ['GITHUB_RUN_ID'], 'runnerOs':os.environ['RUNNER_OS'], 'actualUnity':False, 'productIntegration':False, 'devicePowerLossTested':False},indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v2-files-${{ matrix.label }}-${{ github.sha }}
          path: ${{ runner.temp }}/v2-files
          retention-days: 14
          if-no-files-found: warn
