name: R03 LM artifact read-only audit
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-lm-artifact-audit.yml'
      - 'Tools/AssemblyShadow/R03Completion/ci_artifact_audit.py'
      - 'Docs/AssemblyShadow/History/M07R/R03/P_ARTIFACT_AUDIT_INPUT.json'
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Tools/AssemblyShadow/R03Completion/ci_artifact_audit.py
            Tools/AssemblyShadow/R03Completion/test_lm_artifact_audit.py
      - name: Audit adversarial contracts
        run: python3 -B -m unittest discover -s Tools/AssemblyShadow/R03Completion -p test_lm_artifact_audit.py -v
      - name: Authenticate requested exact-source artifacts without executing their contents
        run: python3 -B Tools/AssemblyShadow/R03Completion/ci_artifact_audit.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-lm-audit-${{ github.sha }}
          path: ${{ runner.temp }}/r03-lm-audit-final
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
