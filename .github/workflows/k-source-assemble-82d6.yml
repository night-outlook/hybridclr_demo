name: K reviewed source assembly and host contracts
on:
  push:
    branches: [codex/connector-smoke-k-runtime-82d6]
permissions:
  contents: write
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: seed
          persist-credentials: false
          sparse-checkout: .connector
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c83d6feb1f5610c4a14b589a4215d187ea5a70e8
          path: target
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tools/AssemblyShadow/
      - name: Apply only exact reviewed source bytes
        shell: python
        run: |
          import base64,gzip,hashlib,json,subprocess,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'k-host';out.mkdir()
          manifest=json.loads(Path('seed/.connector/k-source-manifest.json').read_text())
          assert manifest['base']=='c83d6feb1f5610c4a14b589a4215d187ea5a70e8'
          assert subprocess.check_output(['git','-C','target','rev-parse','HEAD'],text=True).strip()==manifest['base']
          patch=gzip.decompress(base64.b64decode(''.join(Path('seed/.connector/k-source-'+str(i)+'.b64').read_text().strip() for i in range(4)),validate=True))
          assert hashlib.sha256(patch).hexdigest()==manifest['patchSha256']
          for row in manifest['files']:
              path=Path('target')/row['path']
              assert row['path'].startswith('Tools/AssemblyShadow/') and '..' not in path.parts
              if row['before']:
                  data=path.read_bytes();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['before']
              else: assert not path.exists()
          subprocess.run(['git','-C','target','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','-C','target','apply','-'],input=patch,check=True)
          for row in manifest['files']:
              data=(Path('target')/row['path']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['after']
          changed=set(subprocess.check_output(['git','-C','target','diff','--name-only'],text=True).splitlines())
          added=set(subprocess.check_output(['git','-C','target','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed|added=={r['path'] for r in manifest['files']}
          (out/'source-bindings.json').write_text(json.dumps(manifest,indent=2)+'\n')
      - name: Host contracts and actual native snapshot transport
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          cd target
          python3 -B -m unittest discover -s Tools/AssemblyShadow/R03IR -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/k-host/host.log"
          R03_SANITIZERS=1 python3 -B -m unittest discover -s Tools/AssemblyShadow/R03IR -p test_native_snapshot.py -v 2>&1 | tee "$RUNNER_TEMP/k-host/sanitized-snapshot.log"
          git diff --check
      - name: Create content-addressed Git source objects only
        if: matrix.os == 'ubuntu-24.04'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          root=Path('target');out=Path(os.environ['RUNNER_TEMP'])/'k-host'
          manifest=json.loads((out/'source-bindings.json').read_text())
          base=manifest['base'];api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def request(path,data=None):
              req=urllib.request.Request(api+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          tree=[]
          for row in manifest['files']:
              data=(root/row['path']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              blob=request('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert blob['sha']==row['after']
              old=subprocess.run(['git','-C','target','ls-tree',base,'--',row['path']],capture_output=True,text=True,check=True).stdout
              mode=old.split()[0] if old else '100644'
              tree.append({'path':row['path'],'mode':mode,'type':'blob','sha':blob['sha']})
          base_tree=subprocess.check_output(['git','-C','target','rev-parse',base+'^{tree}'],text=True).strip()
          result=request('/git/trees',{'base_tree':base_tree,'tree':tree})
          # No branch or commit APIs are called here. Primary commits/updates
          # the authoritative feature branch through its GitHub Connector.
          receipt={'kind':'KReviewedSourceObjects','base':base,'baseTree':base_tree,'tree':result['sha'],'files':tree,'workflowSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'refsChanged':False,'commitsCreated':False}
          (out/'source-tree.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
      - name: Bind retained logs
        if: always()
        shell: python
        run: |
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'k-host';out.mkdir(exist_ok=True)
          files=[{'path':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in out.iterdir() if p.is_file()]
          (out/'provenance.json').write_text(json.dumps({'workflowSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'files':files,'unityRun':False,'officialCompilation':False},indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: k-host-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/k-host
          retention-days: 14
          if-no-files-found: error
