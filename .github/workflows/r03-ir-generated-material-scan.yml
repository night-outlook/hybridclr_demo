name: R03 original-S generated material read-only scan
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-ir-generated-material-scan.yml'
      - 'Tools/AssemblyShadow/R03IR/audit_s_generated_material.py'
      - 'Tools/AssemblyShadow/R03IR/test_s_generated_material_audit.py'
permissions:
  contents: read
jobs:
  original-s-material:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tools
          persist-credentials: false
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/audit_s_generated_material.py
            Tools/AssemblyShadow/R03IR/test_s_generated_material_audit.py
      - name: Test host-only lexical contracts
        shell: bash
        run: |
          PYTHONPATH=tools/Tools/AssemblyShadow/R03IR \
            python3 -m unittest discover \
              -s tools/Tools/AssemblyShadow/R03IR \
              -p test_s_generated_material_audit.py -v
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fc55d8b8ce1738fda465c06cd97dc2a8f95ce34b
          path: original
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Docs/AssemblyShadow/History/M07R/R03/local-validation-20261007-batch-s-evidence-ready/batch/evidence-index.json
            /Docs/AssemblyShadow/History/M07R/R03/local-validation-20261007-batch-s-evidence-ready/batch/projects/resource-complete/Builds/AssemblyShadow/M07/*/il2cppOutput/Il2CppGenericMethodPointerTable.c
            /Docs/AssemblyShadow/History/M07R/R03/local-validation-20261007-batch-s-evidence-ready/batch/projects/resource-complete/Builds/AssemblyShadow/M07/*/il2cppOutput/Il2CppInvokerTable.cpp
      - name: Authenticate immutable source and collect bounded lexical markers
        shell: bash
        run: |
          python3 -B tools/Tools/AssemblyShadow/R03IR/audit_s_generated_material.py \
            --original "$GITHUB_WORKSPACE/original" \
            --output "$GITHUB_WORKSPACE/r03-s-generated-material.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-s-generated-material-readonly
          path: r03-s-generated-material.json
          if-no-files-found: warn
          retention-days: 30
