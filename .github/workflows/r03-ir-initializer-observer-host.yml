name: R03 initializer prepared observer C++11 host checks
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-ir-initializer-observer-host.yml'
      - 'Tools/AssemblyShadow/R03IR/NativeDiagnostics/test_initializer_observer_native.py'
      - 'Tools/AssemblyShadow/R03IR/PlayerProject/R03InitializerPreparedProbe.cpp'
permissions:
  contents: read
jobs:
  observer-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/NativeDiagnostics/test_initializer_observer_native.py
            Tools/AssemblyShadow/R03IR/PlayerProject/R03InitializerPreparedProbe.cpp
      - name: Compile actual observer and run fake-VM host checks
        shell: bash
        run: |
          python3 -B -m unittest discover \
            -s Tools/AssemblyShadow/R03IR/NativeDiagnostics \
            -p test_initializer_observer_native.py -v
          echo "Host-only: no native Unity/Player execution"
