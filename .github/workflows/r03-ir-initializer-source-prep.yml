name: R03 isolated initializer source preparation host contracts
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-ir-initializer-source-prep.yml'
      - 'Tools/AssemblyShadow/R03IR/prepare_initializer_sources.py'
      - 'Tools/AssemblyShadow/R03IR/test_initializer_source_preparation.py'
      - 'Tools/AssemblyShadow/R03IR/PlayerProject/R03InitializerObservationPlayer.cs'
      - 'Tools/AssemblyShadow/R03IR/PlayerProject/R03InitializerPreparedProbe.cpp'
      - 'Tools/AssemblyShadow/R03IR/PlayerProject/R03InitializerObservationWriter.cpp'
permissions:
  contents: read
jobs:
  host-preparation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/prepare_initializer_sources.py
            Tools/AssemblyShadow/R03IR/test_initializer_source_preparation.py
            Tools/AssemblyShadow/R03IR/PlayerProject/R03InitializerObservationPlayer.cs
            Tools/AssemblyShadow/R03IR/PlayerProject/R03InitializerPreparedProbe.cpp
            Tools/AssemblyShadow/R03IR/PlayerProject/R03InitializerObservationWriter.cpp
      - name: Run actual source-preparation host contracts
        shell: bash
        run: |
          python3 -B -m unittest discover \
            -s Tools/AssemblyShadow/R03IR \
            -p test_initializer_source_preparation.py -v
          echo "Source only, no Unity, no Local Validation authorization"
