name: R03 B2 D3 exact Runtime Codec phase bridge (NOT Unity)
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/extract_d3_runtime_bridge.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/test_extract_d3_runtime_bridge.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/D3RuntimeBridgeHost.cpp
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/D3FailureDecisionHost.cpp
      - .github/workflows/r03-b2-d3-runtime-bridge-host.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-d3-runtime-bridge:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        standard: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: Tools/AssemblyShadow/R03IR/TypeDefCensus
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/hybridclr
          ref: c3c232023724cbad565b85e9b2c3beea8ce2789a
          path: _hybrid_d3
          filter: blob:none
          sparse-checkout: |
            hybridclr/metadata/InterpreterMetadataIndexRuntime.h
            hybridclr/metadata/InterpreterMetadataIndexRuntime.cpp
            hybridclr/metadata/InterpreterMetadataIndexCodec.h
            hybridclr/metadata/InterpreterImage.h
            hybridclr/metadata/InterpreterImage.cpp
            hybridclr/metadata/Assembly.h
            hybridclr/metadata/StagedAssembly.cpp
            hybridclr/metadata/AssemblyShadowBridge.h
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: e31d73968e1895e46c0d790132f1b10b23f78842
          path: _native_d3
          filter: blob:none
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadow.cpp
            libil2cpp/vm/AssemblyShadowPublicationPhaseReceipt.h
            libil2cpp/vm/AssemblyShadowPublicationD3Decision.h
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source authentication and adversarial mutations
        shell: bash
        env:
          R03_B2_D3_NATIVE_ROOT: ${{ github.workspace }}/_native_d3
          R03_B2_D3_HYBRID_ROOT: ${{ github.workspace }}/_hybrid_d3
        run: |
          set -euo pipefail
          test "$(git -C "$R03_B2_D3_NATIVE_ROOT" rev-parse HEAD)" = e31d73968e1895e46c0d790132f1b10b23f78842
          test "$(git -C "$R03_B2_D3_HYBRID_ROOT" rev-parse HEAD)" = c3c232023724cbad565b85e9b2c3beea8ce2789a
          dir=Tools/AssemblyShadow/R03IR/TypeDefCensus
          python3 "$dir/test_extract_d3_runtime_bridge.py" -v 2>&1 | tee "$RUNNER_TEMP/d3-tests.log"
          grep -q 'Ran 15 tests' "$RUNNER_TEMP/d3-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/d3-tests.log"
          if grep -E 'skipped=|FAILED|ERROR:' "$RUNNER_TEMP/d3-tests.log"; then exit 1; fi
          python3 "$dir/extract_d3_runtime_bridge.py" \
            --native-root "$R03_B2_D3_NATIVE_ROOT" \
            --hybrid-root "$R03_B2_D3_HYBRID_ROOT" \
            --output "$RUNNER_TEMP/D3ExactNativeCallbacks.inc" \
            --receipt "$RUNNER_TEMP/d3-source.json"
          cat "$RUNNER_TEMP/d3-source.json"
          python3 - "$RUNNER_TEMP/d3-source.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf8') as f:d=json.load(f)
          assert d['schema']=='R03B2D3SourceReceiptV1'
          assert d['result']=='PassedPinnedD3SourceAndExtractionOnly'
          assert d['bodyCount']==9 and len(d['nativeBlobs'])==3
          assert len(d['hybridBlobs'])==8
          assert d['handoffAuthority']=='CLOSED_NO_LOCAL_EXECUTION'
          for k in ('realVmBridge','unityPlayerExecuted','fullNativeTranslationUnitsCompiled',
                    'codecRollbackProven','D4Completed','R03Accepted','ReadyForHumanReviewGate'):
              assert d[k] is False,k
          PY
      - name: Actual Runtime and Codec, extracted native callback host
        shell: bash
        env:
          STANDARD: ${{ matrix.standard }}
        run: |
          set -euo pipefail
          printf '#pragma once\n#define HYBRIDCLR_ENABLE_ASSEMBLY_SHADOW 1\n' > "$RUNNER_TEMP/il2cpp-config.h"
          if [[ "$RUNNER_OS" == macOS ]]; then cxx=clang++; extra=(-Wall); else
            cxx=g++; extra=(-Wall -Wno-error=maybe-uninitialized); fi
          dir=Tools/AssemblyShadow/R03IR/TypeDefCensus
          native=_native_d3/libil2cpp/vm
          hybrid=_hybrid_d3
          runtime="$hybrid/hybridclr/metadata/InterpreterMetadataIndexRuntime.cpp"
          scenarios=(used-precodec runtime-precheck codec-validation runtime-success post-group-rejection attempt-not-used bad-observer)
          for profile in strict sanitized; do
            flags=(-O2)
            if [[ "$profile" == sanitized ]]; then
              flags=(-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer)
            fi
            "$cxx" -std="$STANDARD" "${flags[@]}" "${extra[@]}" -Wall -Wextra -Werror -pedantic -pthread \
              -I "$RUNNER_TEMP" -I "$native" -I "$hybrid" \
              "$dir/D3RuntimeBridgeHost.cpp" "$runtime" -o "$RUNNER_TEMP/d3-runtime-host"
            for scenario in "${scenarios[@]}"; do
              ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
                "$RUNNER_TEMP/d3-runtime-host" "$scenario" > "$RUNNER_TEMP/d3-runtime.json"
              cat "$RUNNER_TEMP/d3-runtime.json"
              python3 - "$RUNNER_TEMP/d3-runtime.json" "$scenario" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf8') as f:r=json.load(f)
          assert r['schema']=='R03B2D3ActualRuntimeHostV1'
          assert r['result']=='PassedExactRuntimeAndNativeCallbacksHostOnly'
          assert r['scenario']==sys.argv[2] and r['checks']>=8
          assert r['actualRuntimeCodec'] and r['nativeCallbacksExtracted']
          assert r['vmAndStagedAdapterMock']
          assert not any(r[k] for k in ('postCodecRollbackProven','unityPlayerExecuted','R03Accepted','D4Complete'))
          PY
            done
          done
      - name: Exact C++11 D3 decision under strict sanitizer and no-exceptions
        shell: bash
        env:
          STANDARD: ${{ matrix.standard }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then cxx=clang++; else cxx=g++; fi
          dir=Tools/AssemblyShadow/R03IR/TypeDefCensus
          native=_native_d3/libil2cpp/vm
          scenarios=(used-denial held-usage runtime-failed precodec-after-append codec-attempted terminal-reason-immutable)
          for profile in strict sanitized no-exceptions; do
            flags=(-O2)
            if [[ "$profile" == sanitized ]]; then flags=(-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer); fi
            if [[ "$profile" == no-exceptions ]]; then flags=(-O2 -fno-exceptions -fno-rtti); fi
            "$cxx" -std="$STANDARD" "${flags[@]}" -Wall -Wextra -Werror -pedantic \
              -I "$native" "$dir/D3FailureDecisionHost.cpp" -o "$RUNNER_TEMP/d3-decision-host"
            for scenario in "${scenarios[@]}"; do
              ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
                "$RUNNER_TEMP/d3-decision-host" "$scenario" > "$RUNNER_TEMP/d3-decision.json"
              cat "$RUNNER_TEMP/d3-decision.json"
              python3 - "$RUNNER_TEMP/d3-decision.json" "$scenario" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf8') as f:r=json.load(f)
          assert r['schema']=='R03B2D3ActualDecisionHeaderV1'
          assert r['result']=='PassedExactNativeDecisionHeaderOnly'
          assert r['case']==sys.argv[2] and r['checks']>=2 and r['noUnity']
          PY
            done
          done
