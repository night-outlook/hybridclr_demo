name: R03 B2 extracted native registry exception host (NOT Unity)
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/NativeRegistryExceptionalHost.cpp
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/extract_native_registry_publication.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/test_extract_native_registry_publication.py
      - .github/workflows/r03-b2-native-registry-exception-host.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-body-host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        standard: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: Tools/AssemblyShadow/R03IR/TypeDefCensus
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: cecf4b859d50b128e5c0fc6c90cd89e3a452b96a
          path: _native_pinned
          filter: blob:none
          sparse-checkout: |
            libil2cpp/vm/Assembly.cpp
            libil2cpp/vm/MetadataCache.cpp
            libil2cpp/vm/AssemblyShadow.cpp
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact source extraction and C++ host tests
        shell: bash
        env:
          STANDARD: ${{ matrix.standard }}
          R03_B2_NATIVE_ROOT: ${{ github.workspace }}/_native_pinned
        run: |
          set -euo pipefail
          test "$(git -C "$R03_B2_NATIVE_ROOT" rev-parse HEAD)" = 'cecf4b859d50b128e5c0fc6c90cd89e3a452b96a'
          dir=Tools/AssemblyShadow/R03IR/TypeDefCensus
          python3 "$dir/test_extract_native_registry_publication.py" -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
          grep -q 'Ran 10 tests' "$RUNNER_TEMP/tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/tests.log"
          if grep -E 'skipped=|FAILED|ERROR:' "$RUNNER_TEMP/tests.log"; then exit 1; fi
          python3 "$dir/extract_native_registry_publication.py" --native-root "$R03_B2_NATIVE_ROOT" --output "$RUNNER_TEMP/NativeRegistryExactBodies.inc" --receipt "$RUNNER_TEMP/source.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["bodyCount"]==11 and len(d["sourceBlobs"])==3 and d["nativeProductionModified"] is False' "$RUNNER_TEMP/source.json"
          cat "$RUNNER_TEMP/source.json"
          if [[ "$RUNNER_OS" == macOS ]]; then cxx=clang++; else cxx=g++; fi
          for profile in strict sanitized; do
            flags=(-O2)
            if [[ "$profile" == sanitized ]]; then flags=(-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer); fi
            "$cxx" -std="$STANDARD" "${flags[@]}" -Wall -Wextra -Werror -pedantic -pthread -I "$RUNNER_TEMP" "$dir/NativeRegistryExceptionalHost.cpp" -o "$RUNNER_TEMP/host"
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/host" > "$RUNNER_TEMP/host.json"
            cat "$RUNNER_TEMP/host.json"
            python3 - "$RUNNER_TEMP/host.json" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding='utf8') as f: r=json.load(f)
          assert r['kind']=='R03B2PinnedNativeRegistryPublisherHost'
          assert r['result']=='ObservedExceptionalRegistryAndUsageLockLeakInHost'
          assert r['scenarios']==4 and r['checks']>=30
          for k in ('actualNativeSourceBodiesCompiled','mockNativeDependencies','injectedCallbackException'): assert r[k] is True,k
          for k in ('actualCodecRuntimeInvoked','exceptionalRegistryRollbackObserved','usageLockReleasedOnException','realUnity','nativeProductionChanged','safeRecoveryProven','R03Accepted','H2Passed','ReadyForHumanReviewGate'): assert r[k] is False,k
          print('Pinned native bodies exception scenario PASS; NOT Unity')
          PY
          done
