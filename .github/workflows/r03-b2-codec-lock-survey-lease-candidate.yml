name: R03 B2 codec lock survey and RAII usage lease (NOT Unity)
on:
  push:
    branches:
      - codex/assembly-shadow-r01b-h1
    paths:
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_publication_lock_closure.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/test_verify_publication_lock_closure.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/PublicationUsageLeaseCandidate.h
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/PublicationUsageLeaseCandidateHost.cpp
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_native_source_path_boundary.py
      - .github/workflows/r03-b2-codec-lock-survey-lease-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-source-and-lease:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout primary source-only changes
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/TypeDefCensus
          sparse-checkout-cone-mode: true
      - name: Checkout exact native pin (read-only)
        uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: cecf4b859d50b128e5c0fc6c90cd89e3a452b96a
          path: _native_pinned
          filter: blob:none
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadow.cpp
          sparse-checkout-cone-mode: false
      - name: Checkout exact HybridCLR pin (read-only)
        uses: actions/checkout@v4
        with:
          repository: night-outlook/hybridclr
          ref: 4b2774b066cfc6afd77a8c8aded6bda7ea574f55
          path: _hybridclr_pinned
          filter: blob:none
          sparse-checkout: |
            hybridclr/metadata/InterpreterMetadataIndexRuntime.cpp
            hybridclr/metadata/InterpreterMetadataIndexCodec.h
            hybridclr/metadata/InterpreterImage.cpp
            hybridclr/metadata/StagedAssembly.cpp
            hybridclr/metadata/Assembly.cpp
          sparse-checkout-cone-mode: false
      - name: Pinned source verification and no-skip mutations
        shell: bash
        env:
          R03_B2_PINNED_NATIVE_ROOT: _native_pinned
          R03_B2_PINNED_HYBRIDCLR_ROOT: _hybridclr_pinned
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Tools/AssemblyShadow/R03IR/TypeDefCensus \
            -p 'test_verify_publication_lock_closure.py' -v \
            2>&1 | tee "$RUNNER_TEMP/source-tests.log"
          if grep -Eq 'skipped=[1-9]|FAILED|ERROR' "$RUNNER_TEMP/source-tests.log"; then
            echo 'Exact pinned-source regression must run without skips'; exit 1
          fi
          python3 Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_publication_lock_closure.py \
            --native-root _native_pinned --hybridclr-root _hybridclr_pinned \
            --output "$RUNNER_TEMP/source.json"
          python3 - "$RUNNER_TEMP/source.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf8') as f:r=json.load(f)
          assert r['result']=='PinnedRuntimeCodecLockSiteSurveyOnly'
          assert r['nativeCommit']=='cecf4b859d50b128e5c0fc6c90cd89e3a452b96a'
          assert r['hybridclrCommit']=='4b2774b066cfc6afd77a8c8aded6bda7ea574f55'
          assert len(r['pinnedFiles']['il2cpp_plus'])==1
          assert len(r['pinnedFiles']['hybridclr'])==5
          assert r['reservationMutexSites']==6 and r['codecMutexSites']==8
          assert r['scopedConstructionOverloads']==2
          assert r['observedCrossCallbackManualUsageLock'] is True
          assert r['manualUsageLockExceptionSafe'] is False
          assert r['reviewedScopeExhaustsAllRuntimeLocks'] is False
          for k in ('deadlockFreedomProven','shutdownProgressProven','classGcVmEpochProven',
                    'nativeChangesApplied','runtimeUnityEvidence','R03Accepted',
                    'H2Passed','ReadyForHumanReviewGate'):
              assert r[k] is False,k
          assert r['handoffAuthority']=='CLOSED_NO_LOCAL_EXECUTION'
          print('Pinned source-only Runtime/Codec lock inventory PASS')
          PY
      - name: C++11/C++17 synthetic lease candidate, strict and sanitizer
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then cxx=clang++; else cxx=g++; fi
          source=Tools/AssemblyShadow/R03IR/TypeDefCensus/PublicationUsageLeaseCandidateHost.cpp
          for standard in c++11 c++17; do
            for profile in strict sanitized; do
              if [[ "$profile" == strict ]]; then
                "$cxx" -std="$standard" -O2 -Wall -Wextra -Werror -pedantic \
                  "$source" -o "$RUNNER_TEMP/lease-host"
              else
                "$cxx" -std="$standard" -O1 -g -Wall -Wextra -Werror -pedantic \
                  -fsanitize=address,undefined -fno-omit-frame-pointer \
                  "$source" -o "$RUNNER_TEMP/lease-host"
              fi
              ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
                UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
                "$RUNNER_TEMP/lease-host" > "$RUNNER_TEMP/lease.json"
              python3 - "$RUNNER_TEMP/lease.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf8') as f:r=json.load(f)
          assert r['kind']=='R03B2PublicationUsageLeaseCandidateHost'
          assert r['result']=='PassedSyntheticOnly'
          assert r['cases']==14 and r['checks']>=59
          assert r['nativeIntegrated'] is False
          assert r['manualUsageLockExceptionSafeProven'] is False
          assert r['realUnity'] is False
          assert r['R03Accepted'] is False and r['ReadyForHumanReviewGate'] is False
          print('Synthetic RAII lease contract PASS; not an IL2CPP integration')
          PY
            done
          done
