name: R03 one-use current-native Local cycle host contracts
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - 'Tools/AssemblyShadow/R03IR/run_current_native_validation_cycle.py'
      - 'Tools/AssemblyShadow/R03IR/current_native_cycle_contracts.py'
      - '.github/workflows/r03-ir-current-native-local-cycle-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-only:
    name: Preflight/oracle/VM/dispatch tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - name: Demo R03 and R03IR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            Tools/AssemblyShadow/R03
            Tools/AssemblyShadow/R03IR
      - name: Current native VM e1e5 (source only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/il2cpp_plus
          ref: e1e5be67641f18c4a5b1d5fb35429a6d15aa2edb
          path: external/il2cpp_plus
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            libil2cpp/vm
      - name: Interpreter 4b27 (source only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr
          ref: 4b2774b066cfc6afd77a8c8aded6bda7ea574f55
          path: external/hybridclr
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            hybridclr/interpreter/Interpreter_Execute.cpp
      - name: Package 948c (source only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_unity
          ref: 948c0e3b4f8891481301770115e8ba4945eea6de
          path: external/hybridclr_unity
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
      - name: Twenty one-use coordinator adversarial host tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B Tools/AssemblyShadow/R03IR/current_native_cycle_contracts.py
      - name: Existing 20 source, 27 real-oracle synthetic, 12 VM source and archive host suites
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B Tools/AssemblyShadow/R03IR/current_native_source_contracts.py \
            --demo "$PWD" --native "$PWD/external/il2cpp_plus" \
            --hybridclr "$PWD/external/hybridclr" --package "$PWD/external/hybridclr_unity"
          python3 -B Tools/AssemblyShadow/R03IR/current_native_oracle_contracts.py
          python3 -B Tools/AssemblyShadow/R03IR/current_native_vm_delta_contracts.py \
            --native "$PWD/external/il2cpp_plus"
          python3 -B Tools/AssemblyShadow/R03IR/test_audit_s_provenance.py
      - name: Explicit host-only verdict
        shell: bash
        run: |
          echo 'This workflow performs host/source tests only.'
          echo 'NO new Unity/IL2CPP build, installed native proof or actual Player.'
          echo 'NO original-S archive reproduction and no R03/H2 acceptance.'
