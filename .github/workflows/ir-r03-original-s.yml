name: IR R03 original S provenance
on:
  push:
    branches: [codex/ir-r03-fix-smoke-034db097]
    paths: ['Tools/AssemblyShadow/IRR03/audit_s.py', '.github/workflows/ir-r03-original-s.yml']
permissions:
  contents: read
jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          sparse-checkout: Tools/AssemblyShadow/IRR03
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fc55d8b8ce1738fda465c06cd97dc2a8f95ce34b
          path: workspace/hybridclr_demo
          sparse-checkout: Docs/AssemblyShadow/History/M07R/R03/local-validation-20261007-batch-s-evidence-ready
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/hybridclr
          ref: 4b2774b066cfc6afd77a8c8aded6bda7ea574f55
          path: workspace/hybridclr
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/hybridclr_unity
          ref: 948c0e3b4f8891481301770115e8ba4945eea6de
          path: workspace/hybridclr_unity
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: 1cf87f8209790f9fb2ebec97487dc1990ccd56c5
          path: workspace/il2cpp_plus
          persist-credentials: false
      - name: Fetch executed demo source without moving checkpoint HEAD
        run: git -C workspace/hybridclr_demo fetch --depth=1 origin 29bb3d4a39bf8a2f23be404f77535aaba3485bfc
      - name: Read-only original byte and source joins
        run: |
          set -o pipefail
          python3 -u harness/Tools/AssemblyShadow/IRR03/audit_s.py --workspace workspace --output audit-out | tee audit-command.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ir-r03-original-s-audit
          path: |
            audit-out/*.json
            audit-command.log
            harness/Tools/AssemblyShadow/IRR03/audit_s.py
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ir-r03-original-s-reconstructed
          compression-level: 0
          path: |
            audit-out/originals/batch/evidence.tar.gz
            audit-out/originals/batch/BATCH_EXECUTION.json
            audit-out/originals/batch/LOCAL_BATCH_RESULT.json
          if-no-files-found: error
