name: R03 B2 actual Runtime publication group (mock VM bridge; NOT Unity)
on:
  push:
    branches:
      - codex/assembly-shadow-r01b-h1
    paths:
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/ActualRuntimePublicationGroupHost.cpp
      - .github/workflows/r03-b2-actual-runtime-publication-group-host.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-runtime-group:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        standard: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/TypeDefCensus
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/hybridclr
          ref: 4b2774b066cfc6afd77a8c8aded6bda7ea574f55
          path: _hybridclr_pinned
          filter: blob:none
          sparse-checkout: |
            hybridclr/metadata/InterpreterMetadataIndexCodec.h
            hybridclr/metadata/InterpreterMetadataIndexRuntime.h
            hybridclr/metadata/InterpreterMetadataIndexRuntime.cpp
            hybridclr/metadata/AssemblyShadowBridge.h
          sparse-checkout-cone-mode: false
      - name: Pin four exact source blobs and run strict / sanitized host tests
        shell: bash
        env:
          STANDARD: ${{ matrix.standard }}
        run: |
          set -euo pipefail
          root=_hybridclr_pinned
          test "$(git -C "$root" rev-parse HEAD)" = '4b2774b066cfc6afd77a8c8aded6bda7ea574f55'
          check_blob() {
            local path="$1" expected="$2"
            test "$(git -C "$root" rev-parse "HEAD:$path")" = "$expected"
            test "$(git -C "$root" hash-object "$path")" = "$expected"
          }
          check_blob hybridclr/metadata/InterpreterMetadataIndexCodec.h 2020d4e2da6dea8601525203e7ab307d21c40a73
          check_blob hybridclr/metadata/InterpreterMetadataIndexRuntime.h c39ac0f5a0c1ea93c55d51e04d25d31a71775260
          check_blob hybridclr/metadata/InterpreterMetadataIndexRuntime.cpp 509e357359a8912c05adac3434a7e71b3fc3f83c
          check_blob hybridclr/metadata/AssemblyShadowBridge.h 5340c0bf9e4c4c211b4379929f3f79133661505a
          mkdir -p "$RUNNER_TEMP/r03-b2-stub"
          printf '#pragma once\n#define HYBRIDCLR_ENABLE_ASSEMBLY_SHADOW 1\n' > "$RUNNER_TEMP/r03-b2-stub/il2cpp-config.h"
          # GCC -O2 conservatively warns about FootprintStats.sealed even though
          # GetFootprintStats returns None only after assigning every field.
          # Keep the warning visible; do not silently edit the pinned runtime.
          # macOS ships Bash 3.2; keep this array nonempty under set -u.
          extra_flags=(-Wall)
          if [[ "$RUNNER_OS" == macOS ]]; then
            cxx=clang++
          else
            cxx=g++; extra_flags+=(-Wno-error=maybe-uninitialized)
          fi
          host=Tools/AssemblyShadow/R03IR/TypeDefCensus/ActualRuntimePublicationGroupHost.cpp
          runtime="$root/hybridclr/metadata/InterpreterMetadataIndexRuntime.cpp"
          for profile in strict sanitized; do
            if [[ "$profile" == strict ]]; then
              flags=(-O2)
            else
              flags=(-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer)
            fi
            "$cxx" -std="$STANDARD" "${flags[@]}" "${extra_flags[@]}" -Wall -Wextra -Werror -pedantic -pthread \
              -I "$RUNNER_TEMP/r03-b2-stub" -I "$root" \
              "$host" "$runtime" -o "$RUNNER_TEMP/actual-runtime-group"
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
              UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              "$RUNNER_TEMP/actual-runtime-group" > "$RUNNER_TEMP/actual-runtime-group.json"
            cat "$RUNNER_TEMP/actual-runtime-group.json"
            python3 - "$RUNNER_TEMP/actual-runtime-group.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf8") as f: r=json.load(f)
          assert r["kind"]=="R03B2ActualRuntimePublicationGroup"
          assert r["result"]=="PassedActualRuntimeHostWithMockBridge"
          assert r["scenarios"]==12 and r["checks"]>=60
          for name in ("exactRuntimeSourceRequired","bridgeIsMock",
                       "actualCodecUsed","runtimeGroupNormalReturnsTested"):
              assert r[name] is True,name
          for name in ("vmSnapshotReal","concurrentReadersTested",
                       "exceptionFreedomProven","rollbackAfterPublicationPossible",
                       "nativeProductionChanged","realUnity","R03Accepted",
                       "H2Passed","ReadyForHumanReviewGate"):
              assert r[name] is False,name
          print("Pinned actual Runtime/Codec host normal-return tests PASS; VM bridge is MOCK")
          PY
          done
