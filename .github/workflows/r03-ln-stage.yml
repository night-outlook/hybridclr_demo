name: R03 LN integration object staging
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths: ['.github/workflows/r03-ln-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4d13c67cb3f93c33062afbc8763049e91cca5860
          persist-credentials: false
      - name: Verify exact edits and store immutable blobs without changing branches
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request,zlib
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'}
          chunks=['b26db4d5b5b3ecfc30777752a944595963c34b25','d38af0fb0cb90dc4425543144b97a5f621c64dad','35d847fd8f26040c3958f76f9f9c638c882a97ec']
          encoded=b''
          for oid in chunks:
              obj=json.load(urllib.request.urlopen(urllib.request.Request(api+'/'+oid,headers=headers)))
              data=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==oid
              encoded+=data
          raw=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='b4e76f63002039b70b008f8b9bfd6a576b0ae532a937d778bb4d305592c65a55'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'objects';out.mkdir();rows=[]
          for item in json.loads(raw)['files']:
              path=item['path'];assert not path.startswith('/') and '..' not in pathlib.Path(path).parts
              data=subprocess.check_output(['git','show',item['before']]) if item['before'] else b''
              assert (hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() if data else None)==item['before']
              lines=data.decode().splitlines(keepends=True)
              for e in reversed(item['edits']):lines[e['start']:e['end']]=[e['text']]
              data=''.join(lines).encode();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==item['sha']
              request=urllib.request.Request(api,data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),headers=headers,method='POST')
              response=json.load(urllib.request.urlopen(request));assert response['sha']==item['sha']
              rows.append({'path':path,'mode':item['mode'],'type':'blob','sha':item['sha']})
              target=out/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          (out/'objects.json').write_text(json.dumps(rows,indent=2));print(json.dumps(rows))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r03-ln-demo-objects
          path: ${{ runner.temp }}/objects
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
