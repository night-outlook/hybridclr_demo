name: R03 B2 physical TypeDef-slot upper-bound host (NOT Unity)
on:
  push:
    branches:
      - codex/assembly-shadow-r01b-h1
    paths:
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/PhysicalTypeDefSlotUpperBound.h
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/PhysicalTypeDefSlotUpperBoundHost.cpp
      - .github/workflows/r03-b2-physical-typedef-slot-host.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-slot-upper-bound-host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        standard: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/TypeDefCensus
          sparse-checkout-cone-mode: true
      - name: Checkout exact original physical scan helper (read-only)
        uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: cecf4b859d50b128e5c0fc6c90cd89e3a452b96a
          path: _native_pinned
          filter: blob:none
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadowOriginalV1ImageScan.h
          sparse-checkout-cone-mode: false
      - name: Verify exact source and run strict/sanitized host-only tests
        shell: bash
        env:
          STANDARD: ${{ matrix.standard }}
        run: |
          set -euo pipefail
          test "$(git -C _native_pinned rev-parse HEAD)" = 'cecf4b859d50b128e5c0fc6c90cd89e3a452b96a'
          test "$(git -C _native_pinned rev-parse HEAD:libil2cpp/vm/AssemblyShadowOriginalV1ImageScan.h)" = '41cdb90776f1f68f3fc7cbff85045965e29b99b0'
          test "$(git -C _native_pinned hash-object libil2cpp/vm/AssemblyShadowOriginalV1ImageScan.h)" = '41cdb90776f1f68f3fc7cbff85045965e29b99b0'
          if [[ "$RUNNER_OS" == macOS ]]; then cxx=clang++; else cxx=g++; fi
          source=Tools/AssemblyShadow/R03IR/TypeDefCensus/PhysicalTypeDefSlotUpperBoundHost.cpp
          for profile in strict sanitizer; do
            if [[ "$profile" == sanitizer ]]; then
              "$cxx" -std="$STANDARD" -O1 -g -Wall -Wextra -Werror -pedantic \
                -fsanitize=address,undefined -fno-omit-frame-pointer \
                -I _native_pinned/libil2cpp "$source" -o "$RUNNER_TEMP/physical-slot-host"
            else
              "$cxx" -std="$STANDARD" -O2 -Wall -Wextra -Werror -pedantic \
                -I _native_pinned/libil2cpp "$source" -o "$RUNNER_TEMP/physical-slot-host"
            fi
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              "$RUNNER_TEMP/physical-slot-host" > "$RUNNER_TEMP/host-result.json"
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              "$RUNNER_TEMP/physical-slot-host" --fixture > "$RUNNER_TEMP/complete.json"
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              "$RUNNER_TEMP/physical-slot-host" --incomplete-fixture > "$RUNNER_TEMP/incomplete.json"
            python3 - "$RUNNER_TEMP/host-result.json" "$RUNNER_TEMP/complete.json" "$RUNNER_TEMP/incomplete.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf8') as f: host=json.load(f)
          assert host['kind']=='R03B2PhysicalTypeDefSlotUpperBoundHost'
          assert host['result']=='PassedSyntheticOnly'
          assert host['cases']==17 and host['checks']>=160
          for flag in ('realUnity','nativeIntegrated','R03Accepted','ReadyForHumanReviewGate'):
              assert host[flag] is False, flag
          with open(sys.argv[2],encoding='utf8') as f: complete=json.load(f)
          with open(sys.argv[3],encoding='utf8') as f: incomplete=json.load(f)
          for row in (complete,incomplete):
              assert row['kind']=='R03B2PhysicalSlotCensusFixture'
              assert row['result']=='SyntheticOnly'
              assert row['observedPhysicalImages']==3 and row['zeroImages']==1
              assert row['aotSlots']==120 and row['interpreterSlots']==9000
              assert row['firstPassSlotOccurrences']==9120
              for flag in ('sourceOriginAuthenticated','coherentVmEpochProven',
                           'realUnity','nativeIntegrated','R03Accepted',
                           'ReadyForHumanReviewGate','capacityDecisionAuthorized'):
                  assert row[flag] is False, flag
          assert complete['complete'] is True
          assert complete['upperBoundForSuppliedInventory']==9120
          assert incomplete['complete'] is False
          assert incomplete['upperBoundForSuppliedInventory']==0
          print('Physical-slot source-host synthetic-only matrix PASS')
          PY
          done
