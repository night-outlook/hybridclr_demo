name: R03 initializer diagnostic schema-only checks
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-ir-initializer-observation-schema.yml'
      - 'Tools/AssemblyShadow/R03IR/verify_initializer_observation.py'
      - 'Tools/AssemblyShadow/R03IR/test_initializer_observation.py'
permissions:
  contents: read
jobs:
  schema-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/verify_initializer_observation.py
            Tools/AssemblyShadow/R03IR/test_initializer_observation.py
      - name: Run non-authorizing schema negatives
        shell: bash
        run: |
          python3 -B -m unittest discover \
            -s Tools/AssemblyShadow/R03IR \
            -p test_initializer_observation.py -v
          echo "No Unity run, no native V2 snapshot, no R03 acceptance"
