name: R03 initializer targets host generation
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-ir-initializer-generation.yml'
      - 'Tools/AssemblyShadow/R03/PlayerFixtures/**'
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: demo
          persist-credentials: false
          sparse-checkout: |
            Tools/AssemblyShadow/R03/PlayerFixtures
            Tools/AssemblyShadow/R03/Fixtures
            Tools/AssemblyShadow/R03/HostTests/EnvironmentBoundaries.cs
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_unity
          ref: 948c0e3b4f8891481301770115e8ba4945eea6de
          path: package
          persist-credentials: false
      - name: Build and exercise deterministic generator
        shell: bash
        run: |
          set -euo pipefail
          dotnet build demo/Tools/AssemblyShadow/R03/PlayerFixtures/PlayerFixtures.csproj -c Release -v minimal -p:PackageRoot="$GITHUB_WORKSPACE/package"
          bin="demo/Tools/AssemblyShadow/R03/PlayerFixtures/bin/Release/net8.0/PlayerFixtures.dll"
          dotnet "$bin" --ir-terminal-native-targets "$RUNNER_TEMP/generated-a"
          dotnet "$bin" --ir-terminal-native-targets "$RUNNER_TEMP/generated-b"
          dotnet "$bin" --ir-terminal-host "$RUNNER_TEMP/generated-a/clr-inputs"
          diff -qr "$RUNNER_TEMP/generated-a/native" "$RUNNER_TEMP/generated-b/native"
          diff "$RUNNER_TEMP/generated-a/initializer-native-targets.json" "$RUNNER_TEMP/generated-b/initializer-native-targets.json"
          git -C demo diff --exit-code
          git -C package diff --exit-code
