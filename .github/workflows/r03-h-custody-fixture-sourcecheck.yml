name: R03 H custody fixture real-C regression
on:
  push:
    branches: [codex/r03-h-custody-fixture-ci-20261011-4b8e]
permissions:
  contents: read
jobs:
  immutable-c-fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/IR_LOCAL_CUSTODY_01_2026-10-09/
            /Docs/AssemblyShadow/History/M07R/R03/local-validation-20261009-ir-r03-02-c-custody-blocked/preflight/
      - name: Authenticate real original-C receipts and all 25 default/alias controls
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          OUT="$RUNNER_TEMP/r03-h-custody"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-commit.txt"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path('Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/IR_LOCAL_CUSTODY_01_2026-10-09')
          for f in sorted(p.glob('*.py')):
              ast.parse(f.read_text(),filename=str(f))
          print('Custody source AST Passed')
          PY
          python3 -B -m unittest discover \
            -s Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/IR_LOCAL_CUSTODY_01_2026-10-09 \
            -p test_scoped_custody.py -v 2>&1 | tee "$OUT/custody-tests.log"
          grep -q '^Ran 25 tests' "$OUT/custody-tests.log"
          grep -q '^OK$' "$OUT/custody-tests.log"
          git diff --check
          git diff --exit-code
      - name: Bind original real-C bytes and exact test source
        if: always()
        shell: python
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'r03-h-custody'
          out.mkdir(exist_ok=True)
          p=Path('Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/IR_LOCAL_CUSTODY_01_2026-10-09')
          sources=[]
          for name in ('test_scoped_custody.py','verify_scoped_custody.py'):
              f=p/name
              if f.exists():
                  sources.append({'path':str(f),'gitBlob':subprocess.check_output(['git','rev-parse','HEAD:'+str(f)],text=True).strip(),'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
          files=[{'path':f.name,'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size} for f in out.iterdir() if f.is_file()]
          (out/'provenance.json').write_text(json.dumps({'kind':'R03CustodyRootSourceRegression','sourceCommit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'sources':sources,'files':files,'realCReceiptsAuthenticatedByTests':True,'liveMacSCensus':False,'unityLaunched':False,'runtimeAcceptance':False},indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-h-custody-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/r03-h-custody
          retention-days: 14
          if-no-files-found: warn
