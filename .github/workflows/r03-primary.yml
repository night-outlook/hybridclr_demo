name: R03 Primary evolution contracts
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-primary.yml'
      - 'Tools/AssemblyShadow/R03/**'
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hybridclr_demo
          persist-credentials: false
      - name: Resolve exact package input
        id: pins
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p=json.loads(Path('hybridclr_demo/Tools/AssemblyShadow/R03/source-pins.json').read_text())
          for repo in ('hybridclr','hybridclr_unity','il2cpp_plus'):
              if not re.fullmatch('[0-9a-f]{40}',p[repo]): raise SystemExit('Invalid exact source pin: '+repo)
          if p['phase'] != 'candidate': raise SystemExit('Expected R03 candidate')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('package='+p['hybridclr_unity']+'\n')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        id: package
        with:
          repository: night-outlook/hybridclr_unity
          ref: ${{ steps.pins.outputs.package }}
          path: hybridclr_unity
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_unity
          ref: b936a495ade1691ebb6f3bab8fdff3ef34f6f192
          path: reference-package
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.318'
      - name: Pin SDK selection outside owning repositories
        shell: bash
        run: |
          printf '%s\n' '{"sdk":{"version":"8.0.318","rollForward":"disable"}}' > "$GITHUB_WORKSPACE/global.json"
      - name: Syntax and same-wrapper managed lifetime regression
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in sorted(Path('hybridclr_demo/Tools/AssemblyShadow/R03').glob('*.py')):
              ast.parse(p.read_text(),filename=str(p))
          PY
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R03/run_host_lifetime.py \
            --workspace "$GITHUB_WORKSPACE" \
            --reference-package "$GITHUB_WORKSPACE/reference-package" \
            --output "$RUNNER_TEMP/r03-evolution/lifetime"
      - name: Source integrity and graph call-site inventory
        if: always() && steps.package.outcome == 'success'
        shell: bash
        run: |
          git -C hybridclr_demo diff --exit-code
          git -C hybridclr_unity diff --exit-code
          git -C reference-package diff --exit-code
          test -z "$(git -C hybridclr_demo status --porcelain)"
          test -z "$(git -C hybridclr_unity status --porcelain)"
          test -z "$(git -C reference-package status --porcelain)"
          mkdir -p "$RUNNER_TEMP/r03-evolution/review-inputs"
          git -C hybridclr_unity grep -n -E '\.(ReverseClosure|LoadOrder)\(' -- Editor > "$RUNNER_TEMP/r03-evolution/review-inputs/graph-call-sites.txt"
      - name: Record source and artifact provenance
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'r03-evolution'
          root.mkdir(parents=True,exist_ok=True)
          repos={name:subprocess.check_output(['git','-C',name,'rev-parse','HEAD'],text=True).strip() for name in ('hybridclr_demo','hybridclr_unity','reference-package') if Path(name,'.git').exists()}
          for p in Path('hybridclr_demo/Tools/AssemblyShadow/R03').glob('*.py'):
              dst=root/'review-inputs/source'/p.name
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(p,dst)
          shutil.copyfile('hybridclr_demo/.github/workflows/r03-primary.yml',root/'review-inputs/r03-primary.yml')
          files=[{'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          data={'kind':'R03PrimaryProvenance','workflowSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'runnerOS':os.environ['RUNNER_OS'],'repositories':repos,'files':files,'unityEditorRun':False,'il2cppPlayerRun':False,'runtimeAcceptance':False}
          (root/'provenance.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps({'workflowSha':data['workflowSha'],'runId':data['runId'],'files':len(files),'runtimeAcceptance':False}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-evolution-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/r03-evolution
          retention-days: 14
          if-no-files-found: error
