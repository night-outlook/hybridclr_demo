name: R03 M inventory fixture exact-negative regression
on:
  push:
    branches: [codex/r03-m-inventory-ci-20261012-f4e6]
permissions:
  contents: read
jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tools/AssemblyShadow/R02/
            /Tools/AssemblyShadow/R03/
            /Tools/AssemblyShadow/R03Storage/
            /Tools/AssemblyShadow/R03IR/
      - name: Source syntax, unchanged production guard, all inventory controls
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          OUT="$RUNNER_TEMP/r03-m-inventory"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-commit.txt"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          root=Path('Tools/AssemblyShadow/R03')
          for p in sorted(root.glob('*.py')):
              ast.parse(p.read_text(),filename=str(p))
          print('Host source Python syntax Passed')
          PY
          ACTUAL="$(git rev-parse HEAD:Tools/AssemblyShadow/R03/build_provenance.py)"
          test "$ACTUAL" = "4a9ba7240ded6ad81bcc29ada489ed26cbc2ae50"
          python3 -B -m unittest discover \
            -s Tools/AssemblyShadow/R03 -p test_batch_contract.py -v > "$OUT/inventory.log" 2>&1 \
            || { cat "$OUT/inventory.log"; exit 1; }
          cat "$OUT/inventory.log"
          grep -q '^Ran 29 tests' "$OUT/inventory.log"
          grep -q '^OK$' "$OUT/inventory.log"
          python3 -B -m unittest discover \
            -s Tools/AssemblyShadow/R03 -p 'test_*.py' -v > "$OUT/full-suite.log" 2>&1 \
            || { tail -160 "$OUT/full-suite.log"; exit 1; }
          tail -18 "$OUT/full-suite.log"
          grep -q '^Ran 203 tests' "$OUT/full-suite.log"
          grep -q '^OK$' "$OUT/full-suite.log"
          git diff --check
          git diff --exit-code
      - name: Source and original log bindings
        if: always()
        shell: python
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'r03-m-inventory'
          out.mkdir(exist_ok=True)
          paths=['Tools/AssemblyShadow/R03/test_batch_contract.py','Tools/AssemblyShadow/R03/build_provenance.py','Tools/AssemblyShadow/R03/run_local.py']
          sources=[{'path':p,'gitBlob':subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip(),'sha256':hashlib.sha256(Path(p).read_bytes()).hexdigest()} for p in paths]
          files=[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in out.iterdir() if p.is_file()]
          (out/'provenance.json').write_text(json.dumps({'kind':'R03MInventoryFixtureTest','sourceCommit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'sources':sources,'files':files,'unityLaunched':False,'runtimeAcceptance':False,'historicalCustodyAccepted':False},indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-m-inventory-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/r03-m-inventory
          retention-days: 14
          if-no-files-found: warn
