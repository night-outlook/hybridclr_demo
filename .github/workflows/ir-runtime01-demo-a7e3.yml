name: IR runtime01 exact demo successor a7e3
on:
  push:
    branches: [codex/ir-runtime01-demo-20261010-a7e3]
    paths: ['.github/workflows/ir-runtime01-demo-a7e3.yml','Tools/AssemblyShadow/R03IR/Runtime01/**']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hybridclr_demo
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03
            Tools/AssemblyShadow/R03IR
            Tools/AssemblyShadow/R03Storage
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_unity
          ref: 948c0e3b4f8891481301770115e8ba4945eea6de
          path: hybridclr_unity
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/il2cpp_plus
          ref: 5df6a01bfee2fe63b28fa45d8720571858c0f589
          path: il2cpp_plus
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_demo
          ref: ec904d3eedf69035d301040ecd81a4137576757f
          path: preservation
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/IR_RUNTIME_01_2026-10-10
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_demo
          ref: 75500e3916300d1fd5f7774e0f9de33b9ed3e7da
          path: original_e
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Docs/AssemblyShadow/History/M07R/R03/local-validation-20261010-ir-r03-02-e-native-receipt/RETAINED_LIVE_ROOTS.json
            /Docs/AssemblyShadow/History/M07R/R03/local-validation-20261010-ir-r03-02-e-native-receipt/batch/evidence-index.json
      - name: Apply exact-source successor recipe
        run: python3 -B hybridclr_demo/Tools/AssemblyShadow/R03IR/Runtime01/ci_transform.py
      - name: Host contracts, actual serializer, native reporting and retained E
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ir-runtime01-demo"
          mkdir -p "$OUT"
          python3 -B -m unittest discover -s hybridclr_demo/Tools/AssemblyShadow/R03IR -p 'test_*.py' -v 2>&1 | tee "$OUT/host.log"
          python3 -B -m unittest discover -s hybridclr_demo/Tools/AssemblyShadow/R03 -p 'test_*.py' -v 2>&1 | tee "$OUT/r03-host.log"
          dotnet build hybridclr_demo/Tools/AssemblyShadow/R03/PlayerApiCompile/PlayerApiCompile.csproj -c Release -v normal \
            -p:PackageRoot="$GITHUB_WORKSPACE/hybridclr_unity" -p:BaseIntermediateOutputPath="$OUT/obj/" -p:OutputPath="$OUT/bin/" 2>&1 | tee "$OUT/managed.log"
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R03IR/Runtime01/test_candidate.py --managed-assembly "$OUT/bin/PlayerApiCompile.dll" 2>&1 | tee "$OUT/persistence.log"
          python3 -B il2cpp_plus/tools/r03/runtime01/test_reporting.py 2>&1 | tee "$OUT/native-reporting.log"
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -pthread -Iil2cpp_plus/libil2cpp il2cpp_plus/tools/r03/terminal_execution_tests.cpp -o "$OUT/terminal-policy"
          "$OUT/terminal-policy" | tee "$OUT/native-policy.log"
          IR_E_SOURCE_ROOT="$GITHUB_WORKSPACE/original_e" python3 -B -m unittest discover \
            -s preservation/Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/IR_RUNTIME_01_2026-10-10 \
            -p 'test_retained_e.py' -v 2>&1 | tee "$OUT/retained-e-tests.log"
      - name: Stage tested source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B hybridclr_demo/Tools/AssemblyShadow/R03IR/Runtime01/ci_stage.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ir-runtime01-demo-host-${{ github.sha }}
          path: ${{ runner.temp }}/ir-runtime01-demo
          retention-days: 14
          if-no-files-found: warn
  official-api:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hybridclr_demo
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tools/AssemblyShadow/R03/
            /Tools/AssemblyShadow/R03IR/
            /Docs/AssemblyShadow/History/M07R/R03/local-validation-20261001-batch-c-return-required/batch/builds/candidate-release/Editor.log
            /Docs/AssemblyShadow/History/M07R/R03/local-validation-20261001-batch-c-return-required/batch/projects/candidate-release/Assets/Editor/R03Build.cs
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_unity
          ref: 948c0e3b4f8891481301770115e8ba4945eea6de
          path: hybridclr_unity
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr
          ref: 4b2774b066cfc6afd77a8c8aded6bda7ea574f55
          path: hybridclr
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/il2cpp_plus
          ref: 5df6a01bfee2fe63b28fa45d8720571858c0f589
          path: il2cpp_plus
          persist-credentials: false
      - name: Apply exact-source successor recipe
        run: python3 -B hybridclr_demo/Tools/AssemblyShadow/R03IR/Runtime01/ci_transform.py
      - name: Extract pinned official Unity APIs and compile; no Unity launch
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ir-runtime01-official"
          mkdir -p "$OUT"
          curl --fail --location --proto '=https' --max-time 900 https://download.unity3d.com/download_unity/7670c08855a9/MacEditorInstallerArm64/Unity-2022.3.62f2.pkg -o "$RUNNER_TEMP/unity.pkg"
          echo '5d2575c1b10a2a9f1f89bf40631a6b9bec3628fe16ca5f2203720af7943a3f05  '"$RUNNER_TEMP/unity.pkg" | shasum -a 256 -c
          pkgutil --expand-full "$RUNNER_TEMP/unity.pkg" "$RUNNER_TEMP/unity-expanded"
          rm "$RUNNER_TEMP/unity.pkg"
          find "$RUNNER_TEMP/unity-expanded" -path '*/Unity.app/Contents/MacOS/Unity' -type f > "$OUT/unity-paths.txt"
          test "$(wc -l < "$OUT/unity-paths.txt" | tr -d ' ')" = 1
          UNITY="$(cat "$OUT/unity-paths.txt")"
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R03/build_api.py --workspace "$GITHUB_WORKSPACE" --unity "$UNITY" --output "$OUT/managed" 2>&1 | tee "$OUT/managed.log"
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R03/native_validation.py --workspace "$GITHUB_WORKSPACE" --unity "$UNITY" --output "$OUT/native" 2>&1 | tee "$OUT/native.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ir-runtime01-official-${{ github.sha }}
          path: ${{ runner.temp }}/ir-runtime01-official
          retention-days: 14
          if-no-files-found: warn
