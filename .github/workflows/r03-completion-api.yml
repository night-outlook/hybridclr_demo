name: R03 resource-complete pinned API compilation
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-completion-api.yml'
      - 'Tools/AssemblyShadow/R03Completion/**'
      - 'Assets/AssemblyShadowDemo/Editor/M02Build.cs'
      - 'Assets/AssemblyShadowDemo/Editor/M07Build.cs'
      - 'Assets/AssemblyShadowDemo/Editor/R03CompilerPolicyChecks.cs'
      - 'Assets/AssemblyShadowDemo/Editor/R03CompletionCompilerPolicyContract.cs'
      - 'ProjectSettings/AssemblyShadowDependencies.json'
      - 'ProjectSettings/AssemblyShadowRawTypeAdmissions.json'
      - 'Assets/AssemblyShadowDemo/Editor/R03ResourceCapabilityProfile.cs'
      - 'Assets/AssemblyShadowDemo/Editor/R03CompletionInventoryContract.cs'
      - 'Assets/AssemblyShadowDemo/Editor/R03CompletionBuild.cs'
      - 'Assets/AssemblyShadowDemo/Editor/R03CompletionSourcePinContract.cs'
      - 'Assets/AssemblyShadowDemo/Editor/R03FixedImageChecks.cs'
      - 'Assets/AssemblyShadowDemo/Editor/R03CompletionFixedImageContract.cs'
      - 'Assets/AssemblyShadowDemo/Bootstrap/R03CompletionExecution.cs'
permissions:
  contents: read
jobs:
  api:
    runs-on: macos-15
    # Reference replay plus official Unity extraction can exceed 30 minutes on hosted macOS.
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hybridclr_demo
          persist-credentials: false
      - name: Read exact candidate package revision
        id: pins
        shell: python
        run: |
          import json,os,re
          p=json.load(open('hybridclr_demo/Tools/AssemblyShadow/R03Completion/source-pins.json'))
          assert re.fullmatch('[0-9a-f]{40}',p['hybridclr_unity'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('package='+p['hybridclr_unity']+'\n')
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_unity
          ref: ${{ steps.pins.outputs.package }}
          path: hybridclr_unity
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Unity-Technologies/Graphics
          ref: 4694a5f37cb1c40e48058da90d3deab8f440dae6
          path: graphics
          persist-credentials: false
          sparse-checkout: |
            Packages/com.unity.render-pipelines.core/Runtime
            Packages/com.unity.render-pipelines.core/package.json
          sparse-checkout-cone-mode: false
      - name: Extract exact official compiler and API profile without Editor launch
        shell: bash
        run: |
          curl --fail --location --proto '=https' --max-time 900 https://download.unity3d.com/download_unity/7670c08855a9/MacEditorInstallerArm64/Unity-2022.3.62f2.pkg -o "$RUNNER_TEMP/unity.pkg"
          echo '5d2575c1b10a2a9f1f89bf40631a6b9bec3628fe16ca5f2203720af7943a3f05  '"$RUNNER_TEMP/unity.pkg" | shasum -a 256 -c
          pkgutil --expand-full "$RUNNER_TEMP/unity.pkg" "$RUNNER_TEMP/unity-expanded"
          find "$RUNNER_TEMP/unity-expanded" -path '*/Unity.app/Contents/MacOS/Unity' -type f > "$RUNNER_TEMP/unity-paths.txt"
          test "$(wc -l < "$RUNNER_TEMP/unity-paths.txt" | tr -d ' ')" = 1
      - name: Acquire the original locked JSON parser package
        shell: python
        run: |
          import hashlib,json,os,tarfile,urllib.request
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);name='com.unity.nuget.newtonsoft-json';version='3.2.1'
          metadata=json.load(urllib.request.urlopen('https://packages.unity.com/'+name,timeout=120))
          dist=metadata['versions'][version]['dist']
          data=urllib.request.urlopen(dist['tarball'],timeout=180).read()
          assert hashlib.sha1(data).hexdigest()==dist['shasum']
          archive=root/'newtonsoft.tgz';archive.write_bytes(data)
          dest=root/'newtonsoft';dest.mkdir()
          with tarfile.open(archive) as tar:tar.extractall(dest,filter='data')
          manifest=json.loads((dest/'package/package.json').read_text())
          assert manifest['name']==name and manifest['version']==version
          plugin=dest/'package/Runtime/Newtonsoft.Json.dll';assert plugin.is_file(),list(dest.rglob('*.dll'))
          (root/'newtonsoft-path.txt').write_text(str(plugin))
          (root/'newtonsoft-binding.json').write_text(json.dumps({'package':name,'version':version,'url':dist['tarball'],'archiveSha256':hashlib.sha256(data).hexdigest(),'registrySha1':dist['shasum'],'pluginSha256':hashlib.sha256(plugin.read_bytes()).hexdigest(),'pluginBytes':plugin.stat().st_size},indent=2)+'\n')
      - name: Compile full original resource project and all actual dependencies
        shell: bash
        run: |
          UNITY="$(cat "$RUNNER_TEMP/unity-paths.txt")"
          CONTENTS="$(dirname "$(dirname "$UNITY")")"
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R03Completion/compile_fixture_api.py \
            --workspace "$GITHUB_WORKSPACE" --contents "$CONTENTS" \
            --core-source "$GITHUB_WORKSPACE/graphics/Packages/com.unity.render-pipelines.core" \
            --runtime "$CONTENTS/NetCoreRuntime/dotnet" --compiler "$CONTENTS/DotNetSdkRoslyn/csc.dll" \
            --newtonsoft "$(cat "$RUNNER_TEMP/newtonsoft-path.txt")" \
            --output "$RUNNER_TEMP/r03-completion-api"
      - name: Authenticate fixed image and run the pinned Mono guard consumer
        shell: bash
        run: |
          UNITY="$(cat "$RUNNER_TEMP/unity-paths.txt")"
          CONTENTS="$(dirname "$(dirname "$UNITY")")"
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R02/export_m00_fixture.py \
            --project "$GITHUB_WORKSPACE/hybridclr_demo" \
            --output "$RUNNER_TEMP/r03-completion-api/fixed-image-origin" --verify-committed
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R03Completion/compile_fixed_image.py \
            --workspace "$GITHUB_WORKSPACE" --contents "$CONTENTS" \
            --output "$RUNNER_TEMP/r03-completion-api/fixed-image-mono"
      - name: Replay exact L compiler bytes through actual raw and bootstrap guards
        shell: bash
        run: |
          UNITY="$(cat "$RUNNER_TEMP/unity-paths.txt")"
          CONTENTS="$(dirname "$(dirname "$UNITY")")"
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R03Completion/compile_policy_checks.py \
            --workspace "$GITHUB_WORKSPACE" --contents "$CONTENTS" \
            --api-output "$RUNNER_TEMP/r03-completion-api" \
            --newtonsoft "$(cat "$RUNNER_TEMP/newtonsoft-path.txt")" \
            --output "$RUNNER_TEMP/r03-completion-api/compiler-policy-mono"
      - name: Check compiler versus linked-Player domains with exact O compiler references
        shell: bash
        run: |
          UNITY="$(cat "$RUNNER_TEMP/unity-paths.txt")"
          CONTENTS="$(dirname "$(dirname "$UNITY")")"
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R03Completion/compile_lo_policy_checks.py \
            --workspace "$GITHUB_WORKSPACE" --contents "$CONTENTS" \
            --api-output "$RUNNER_TEMP/r03-completion-api" \
            --newtonsoft "$(cat "$RUNNER_TEMP/newtonsoft-path.txt")" \
            --output "$RUNNER_TEMP/r03-completion-api/lo-policy-domain"
      - name: Replay captured M layouts through actual forwarding identity rules
        shell: bash
        run: |
          UNITY="$(cat "$RUNNER_TEMP/unity-paths.txt")"
          CONTENTS="$(dirname "$(dirname "$UNITY")")"
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R03Completion/compile_layout_checks.py \
            --workspace "$GITHUB_WORKSPACE" --contents "$CONTENTS" \
            --api-output "$RUNNER_TEMP/r03-completion-api" \
            --newtonsoft "$(cat "$RUNNER_TEMP/newtonsoft-path.txt")" \
            --output "$RUNNER_TEMP/r03-completion-api/layout-identity-mono"
      - name: Replay N reference decoding and closed-domain mutation guards
        shell: bash
        run: |
          UNITY="$(cat "$RUNNER_TEMP/unity-paths.txt")"
          CONTENTS="$(dirname "$(dirname "$UNITY")")"
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R03Completion/compile_reference_checks.py \
            --workspace "$GITHUB_WORKSPACE" --contents "$CONTENTS" \
            --api-output "$RUNNER_TEMP/r03-completion-api" \
            --newtonsoft "$(cat "$RUNNER_TEMP/newtonsoft-path.txt")" \
            --output "$RUNNER_TEMP/r03-completion-api/reference-binding-mono"
      - name: Bind all preserved compiler evidence
        if: always()
        shell: python
        run: |
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'r03-completion-api';root.mkdir(exist_ok=True)
          binding=Path(os.environ['RUNNER_TEMP'])/'newtonsoft-binding.json'
          if binding.is_file():shutil.copyfile(binding,root/'newtonsoft-binding.json')
          refs={n:subprocess.check_output(['git','-C',n,'rev-parse','HEAD'],text=True).strip() for n in ('hybridclr_demo','hybridclr_unity','graphics')}
          for base in ('hybridclr_demo/Tools/AssemblyShadow/R03Completion','hybridclr_demo/Assets/AssemblyShadowDemo/Editor/M02Build.cs','hybridclr_demo/Assets/AssemblyShadowDemo/Editor/M07Build.cs','hybridclr_demo/Assets/AssemblyShadowDemo/Editor/R03CompilerPolicyChecks.cs','hybridclr_demo/Assets/AssemblyShadowDemo/Editor/R03CompletionCompilerPolicyContract.cs','hybridclr_demo/ProjectSettings/AssemblyShadowDependencies.json','hybridclr_demo/ProjectSettings/AssemblyShadowRawTypeAdmissions.json','hybridclr_demo/Assets/AssemblyShadowDemo/Editor/R03ResourceCapabilityProfile.cs','hybridclr_demo/Assets/AssemblyShadowDemo/Editor/R03CompletionInventoryContract.cs','hybridclr_demo/Assets/AssemblyShadowDemo/Editor/R03CompletionBuild.cs','hybridclr_demo/Assets/AssemblyShadowDemo/Editor/R03CompletionSourcePinContract.cs','hybridclr_demo/Assets/AssemblyShadowDemo/Editor/R03FixedImageChecks.cs','hybridclr_demo/Assets/AssemblyShadowDemo/Editor/R03CompletionFixedImageContract.cs','hybridclr_demo/Assets/AssemblyShadowDemo/Bootstrap/R03CompletionExecution.cs','hybridclr_unity/Tests/Editor/AssemblyShadow/SyntheticCompiledAssemblySet.cs','hybridclr_unity/Tests/Editor/AssemblyShadow/ManagedAcquisitionPolicyTests.cs','hybridclr_unity/Tests/Editor/AssemblyShadow/PolicyTests.cs','hybridclr_unity/Editor/AssemblyShadow/Metadata','hybridclr_unity/Editor/AssemblyShadow/Build/NativeLayoutAdmissionSnapshot.cs'):
              p=Path(base)
              for source in ([p] if p.is_file() else p.rglob('*')):
                  if source.is_file() and source.suffix in ('.py','.cs','.csproj','.json'):
                      target=root/'sources'/source;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source,target)
          # Retain the exact historical fixtures consumed by tooling tests so
          # a source-slice audit can run without recreating historical evidence.
          for relative in (
              'local-validation-20261001-batch-d-return-required/batch/editor-results.xml',
              'local-validation-20261003-batch-i-return-required/batch/focused-editor/results.xml',
              'local-validation-20261003-batch-i-return-required/preflight/issue-resource-snapshot/ProjectSettings/AssemblyShadowSourcePins.json'):
              source=Path('hybridclr_demo/Docs/AssemblyShadow/History/M07R/R03')/relative
              target=root/'sources'/source;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source,target)
          files=[{'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          (root/'provenance.json').write_text(json.dumps({'sourceCommit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'repositories':refs,'files':files,'unityRun':False,'playerRun':False,'upmByteEquivalenceClaimed':False},indent=2)+'\n')
          for n in refs:assert not subprocess.check_output(['git','-C',n,'status','--porcelain'],text=True).strip()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-completion-api-${{ github.sha }}
          path: ${{ runner.temp }}/r03-completion-api
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
