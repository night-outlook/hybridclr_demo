name: R03 O snapshot failure contracts
on:
  push:
    branches: [codex/o-snapshot-diagnostics-20261013-62fa, codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-o-snapshot.yml'
      - 'Tools/AssemblyShadow/R03IR/**'
      - 'Tools/AssemblyShadow/R03/PlayerProject/AssemblyShadowR03Probe.cpp'
permissions:
  contents: read
jobs:
  snapshot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tools/AssemblyShadow/R03/
            /Tools/AssemblyShadow/R03IR/
            /Tools/AssemblyShadow/R03Storage/
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.318'
      - name: Original and integrated source-bound host tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          OUT="$RUNNER_TEMP/o-evidence"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-commit.txt"
          python3 -B -m unittest discover -s Tools/AssemblyShadow/R03 -p 'test_*.py' -v > "$OUT/r03.log" 2>&1 || { tail -100 "$OUT/r03.log"; exit 1; }
          grep -q '^Ran 203 tests' "$OUT/r03.log"
          R03_SNAPSHOT_TEST_EVIDENCE="$OUT/snapshot-strict" python3 -B -m unittest discover -s Tools/AssemblyShadow/R03IR -p 'test_*.py' -v > "$OUT/ir.log" 2>&1 || { tail -100 "$OUT/ir.log"; exit 1; }
          grep -q '^Ran 107 tests' "$OUT/ir.log"
          R03_SANITIZERS=1 R03_SNAPSHOT_TEST_EVIDENCE="$OUT/snapshot-sanitized" python3 -B -m unittest discover -s Tools/AssemblyShadow/R03IR -p test_snapshot_diagnostics.py -v > "$OUT/sanitized.log" 2>&1 || { tail -100 "$OUT/sanitized.log"; exit 1; }
          grep -q '^Ran 14 tests' "$OUT/sanitized.log"
          tail -6 "$OUT/r03.log"
          tail -6 "$OUT/ir.log"
          tail -6 "$OUT/sanitized.log"
          git diff --check
          git diff --exit-code
      - name: Exact source and log hashes
        if: always()
        shell: python
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'o-evidence';out.mkdir(exist_ok=True)
          names=['Tools/AssemblyShadow/R03/PlayerProject/AssemblyShadowR03Probe.cpp','Tools/AssemblyShadow/R03IR/PlayerProject/R03TerminalPlayer.cs','Tools/AssemblyShadow/R03IR/snapshot_diagnostics.py','Tools/AssemblyShadow/R03IR/snapshot_transport_harness.py','Tools/AssemblyShadow/R03IR/test_snapshot_diagnostics.py']
          sources=[{'path':p,'gitBlob':subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip(),'sha256':hashlib.sha256(Path(p).read_bytes()).hexdigest()} for p in names]
          files=[{'path':str(p.relative_to(out)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in out.rglob('*') if p.is_file() and not p.is_symlink() and p.suffix in ('.log','.json','.stdout','.stderr','.txt','.cpp')]
          (out/'provenance.json').write_text(json.dumps({'kind':'OSnapshotContracts','source':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'sources':sources,'files':files,'unityRun':False,'NRootCauseProven':False,'engineDispositionFixed':False,'runtimeAcceptance':False},indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-o-snapshot-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/o-evidence/*.log
            ${{ runner.temp }}/o-evidence/*.txt
            ${{ runner.temp }}/o-evidence/*.json
            ${{ runner.temp }}/o-evidence/snapshot-*/*.json
            ${{ runner.temp }}/o-evidence/snapshot-*/*.stdout
            ${{ runner.temp }}/o-evidence/snapshot-*/*.stderr
            ${{ runner.temp }}/o-evidence/snapshot-*/*.cpp
          retention-days: 14
          if-no-files-found: warn
