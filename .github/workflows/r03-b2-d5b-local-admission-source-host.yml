name: R03 D5-B future Local dry admission source-host (NO LOCAL EXECUTION)
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - Tools/AssemblyShadow/R03IR/D5Local/**
      - Tools/AssemblyShadow/R03IR/D5Admission/d5b_rr5_*
      - Tools/AssemblyShadow/R03IR/D5Probe/**
      - .github/workflows/r03-b2-d5b-local-admission-source-host.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  future-admission-source-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: _demo
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/D5Local/
            Tools/AssemblyShadow/R03IR/D5Admission/d5b_rr5_source_preflight.py
            Tools/AssemblyShadow/R03IR/D5Admission/d5b_rr5_source_preflight_v1.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Proposed D5-B physical admission contracts and no-execution controls
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          tool=_demo/Tools/AssemblyShadow/R03IR/D5Local
          python3 -B "$tool/test_d5b_local_admission.py" -v 2>&1 |
            tee "$RUNNER_TEMP/d5b-admission-tests.log"
          grep -q 'Ran 94 tests in' "$RUNNER_TEMP/d5b-admission-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/d5b-admission-tests.log"
      - name: AP1 closed publication proposals using real temporary Git objects
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          tool=_demo/Tools/AssemblyShadow/R03IR/D5Local
          python3 - <<'PY'
          import json, os, platform, shutil, subprocess
          git_tools = {}
          for role, path in (("fixtureGit", shutil.which("git")),
                             ("auditorGit", shutil.which("git", path=os.defpath))):
              git_tools[role] = {
                  "path": path,
                  "version": subprocess.check_output([path, "--version"], text=True).strip(),
              }
          print(json.dumps({"schema": "R03AP1GitToolVersionsV1",
                            "python": platform.python_version(), **git_tools}, sort_keys=True))
          PY
          python3 -B "$tool/test_d5b_activation_publication.py" -v 2>&1 |
            tee "$RUNNER_TEMP/d5b-ap1-publication-tests.log"
          grep -q 'Ran 22 tests in' "$RUNNER_TEMP/d5b-ap1-publication-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/d5b-ap1-publication-tests.log"
          echo '{"schema":"R03D5BActivationPublicationSourceHostV1","publicationTests":22,"fixtureClass":"TemporaryGitObjects","executionAuthority":false,"liveRemoteHeadsVerified":false,"UnityOrPlayerExecuted":false,"result":"SourceOnlyProposalStructureTestsPassed"}'
      - name: AP2 inert runner artifact closure and bounded checkout observations
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          tool=_demo/Tools/AssemblyShadow/R03IR/D5Local
          python3 -B "$tool/test_d5b_runner_closure.py" -v 2>&1 |
            tee "$RUNNER_TEMP/d5b-ap2-runner-closure-tests.log"
          grep -q 'Ran 25 tests in' "$RUNNER_TEMP/d5b-ap2-runner-closure-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/d5b-ap2-runner-closure-tests.log"
          echo '{"schema":"R03D5BRunnerClosureSourceHostV1","closureTests":25,"fixtureClass":"TemporaryGitObjectsAndSyntheticLocations","candidateCodeExecuted":false,"runtimeImportIsolationVerified":false,"continuousCustodyVerified":false,"executionAuthority":false,"liveRemoteHeadsVerified":false,"UnityOrPlayerExecuted":false,"result":"SourceOnlyArtifactClosureTestsPassed"}'
      - name: AP3 private imports from verified snapshots without runner invocation
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          tool=_demo/Tools/AssemblyShadow/R03IR/D5Local
          python3 -I -S -B "$tool/test_d5b_runner_imports.py" -v 2>&1 |
            tee "$RUNNER_TEMP/d5b-ap3-runner-import-tests.log"
          grep -q 'Ran 20 tests in' "$RUNNER_TEMP/d5b-ap3-runner-import-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/d5b-ap3-runner-import-tests.log"
          echo '{"schema":"R03D5BRunnerImportSourceHostV1","importTests":20,"fixtureClass":"TemporaryGitObjectsAndSyntheticLocations","reviewedCandidateInitializationTested":true,"candidateEntryPointsInvoked":false,"runtimeConfigurationReadsBound":false,"runnerExecutableClosureVerified":false,"executionAuthority":false,"UnityOrPlayerExecuted":false,"result":"SourceOnlyImportBindingTestsPassed"}'
      - name: AP4 captured configuration consumers without admission
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          tool=_demo/Tools/AssemblyShadow/R03IR/D5Local
          python3 -I -S -B "$tool/test_d5b_runner_configuration.py" -v 2>&1 |
            tee "$RUNNER_TEMP/d5b-ap4-runner-configuration-tests.log"
          grep -q 'Ran 18 tests in' "$RUNNER_TEMP/d5b-ap4-runner-configuration-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/d5b-ap4-runner-configuration-tests.log"
          echo '{"schema":"R03D5BRunnerConfigurationSourceHostV1","configurationTests":18,"fixtureClass":"TemporaryGitObjectsAndSyntheticLocations","candidateConfigurationConsumersTested":true,"candidateEntryPointsInvoked":false,"runtimeConfigurationReadsBound":false,"runnerExecutableClosureVerified":false,"executionAuthority":false,"UnityOrPlayerExecuted":false,"result":"SourceOnlyConfigurationBindingTestsPassed"}'
      - name: AP5 five checkout identities and exact temporary remote refs
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          tool=_demo/Tools/AssemblyShadow/R03IR/D5Local
          python3 -I -S -B - <<'VERSIONS'
          import json, os, platform, shutil, subprocess
          path = shutil.which("git", path=os.defpath)
          selected_git = {"path": path, "version": subprocess.check_output([path, "--version"], text=True).strip()}
          print(json.dumps({"schema": "R03AP5GitToolVersionsV1", "python": platform.python_version(),
                            "AP5FixtureGit": selected_git, "AP5ObserverGit": selected_git}, sort_keys=True))
          VERSIONS
          python3 -I -S -B "$tool/test_d5b_five_identity.py" -v 2>&1 |
            tee "$RUNNER_TEMP/d5b-ap5-five-identity-tests.log"
          grep -q 'Ran 31 tests in' "$RUNNER_TEMP/d5b-ap5-five-identity-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/d5b-ap5-five-identity-tests.log"
          echo '{"schema":"R03D5BFiveIdentitySourceHostV1","fiveIdentityTests":31,"fixtureClass":"FiveTemporaryCheckoutsAndRealBareRefs","privateFileTransportOnly":true,"productionHttpsReachabilityQualified":false,"productionLiveRemoteHeadsVerified":false,"candidateEntryPointsInvoked":false,"AP4CompositionVerified":false,"runnerPublicationRelationVerified":false,"executionAuthority":false,"UnityOrPlayerExecuted":false,"result":"SourceOnlyFiveIdentityObservationTestsPassed"}'
      - name: AP6 sequential composition with an explicit identity-stage double
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          tool=_demo/Tools/AssemblyShadow/R03IR/D5Local
          python3 -I -S -B "$tool/test_d5b_identity_configuration.py" -v 2>&1 |
            tee "$RUNNER_TEMP/d5b-ap6-composition-unit-tests.log"
          grep -q 'Ran 20 tests in' "$RUNNER_TEMP/d5b-ap6-composition-unit-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/d5b-ap6-composition-unit-tests.log"
          echo '{"schema":"R03D5BIdentityConfigurationUnitSourceHostV1","compositionTests":20,"AP5StageDoubled":true,"realAP4Consumers":true,"fullFiveIdentityIntegrationVerified":false,"executionAuthority":false,"UnityOrPlayerExecuted":false,"result":"SourceOnlyCompositionUnitTestsPassed"}'
      - name: Read pinned hybridclr source for AP6 integration
        uses: actions/checkout@v4
        with:
          repository: night-outlook/hybridclr
          ref: c3c232023724cbad565b85e9b2c3beea8ce2789a
          path: _ap6_siblings/hybridclr
          fetch-depth: 0
          persist-credentials: false
      - name: Read pinned hybridclr_unity source for AP6 integration
        uses: actions/checkout@v4
        with:
          repository: night-outlook/hybridclr_unity
          ref: 948c0e3b4f8891481301770115e8ba4945eea6de
          path: _ap6_siblings/hybridclr_unity
          fetch-depth: 0
          persist-credentials: false
      - name: Read pinned il2cpp_plus source for AP6 integration
        uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: 1268dd417ffe9090fcd9ea2d49542c97ed3cccb3
          path: _ap6_siblings/il2cpp_plus
          fetch-depth: 0
          persist-credentials: false
      - name: AP6 required integration with actual pinned sibling sources and real bare refs
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GIT_TERMINAL_PROMPT: "0"
          AP6_PINNED_SIBLINGS: ${{ github.workspace }}/_ap6_siblings
        run: |
          set -euo pipefail
          tool=_demo/Tools/AssemblyShadow/R03IR/D5Local
          python3 -I -S -B "$tool/integration_d5b_identity_configuration.py" -v 2>&1 |
            tee "$RUNNER_TEMP/d5b-ap6-composition-integration-tests.log"
          grep -q 'Ran 1 test in' "$RUNNER_TEMP/d5b-ap6-composition-integration-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/d5b-ap6-composition-integration-tests.log"
          echo '{"schema":"R03D5BIdentityConfigurationIntegrationSourceHostV1","integrationTests":1,"fixedAP1SiblingSources":true,"privateFileTransportOnly":true,"realAP5AndAP4Observers":true,"productionHttpsReachabilityQualified":false,"executionAuthority":false,"UnityOrPlayerExecuted":false,"result":"SourceOnlySequentialIdentityConfigurationTestsPassed"}'
      - name: Verify no immutable user approval or Unity execution can be asserted
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          tool=_demo/Tools/AssemblyShadow/R03IR/D5Local
          set +e
          python3 -B "$tool/run_d5_local.py" \
            --mode execute \
            --approved-envelope "$RUNNER_TEMP/unapproved-d5b-envelope.json" \
            > "$RUNNER_TEMP/blocked-execution.json"
          code=$?
          set -e
          test "$code" -eq 2
          grep -q '"result": "NotAuthorized"' "$RUNNER_TEMP/blocked-execution.json"
          grep -q '"WEB_TO_LOCAL": "CLOSED_NO_LOCAL_EXECUTION"' "$RUNNER_TEMP/blocked-execution.json"
          grep -q '"outputCreated": false' "$RUNNER_TEMP/blocked-execution.json"
          test ! -e "$RUNNER_TEMP/unapproved-d5b-envelope.json"
          cat "$RUNNER_TEMP/blocked-execution.json"
          echo '{"schema":"R03D5BLocalAdmissionSourceHostV1","sourceTests":94,"approvedEnvelope":false,"localExecution":false,"unityOrPlayer":false,"R03Accepted":false,"result":"SourceOnlyDeniedLocalExecution"}'
