name: R03 B2 cross-repository transitive publication mutex chain (NOT Unity)
on:
  push:
    branches:
      - codex/assembly-shadow-r01b-h1
    paths:
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_native_publication_mutex_chain.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/test_verify_native_publication_mutex_chain.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_native_lock_lifetime_graph.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_native_source_path_boundary.py
      - .github/workflows/r03-b2-transitive-publication-mutex-chain.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transitive-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout Primary source-only verification files
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/TypeDefCensus
          sparse-checkout-cone-mode: true
      - name: Checkout exact native IL2CPP source pin (read-only)
        uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: cecf4b859d50b128e5c0fc6c90cd89e3a452b96a
          path: _native_pinned
          filter: blob:none
          sparse-checkout: |
            libil2cpp/vm/Assembly.cpp
            libil2cpp/vm/MetadataCache.cpp
            libil2cpp/vm/AssemblyShadow.cpp
          sparse-checkout-cone-mode: false
      - name: Checkout exact HybridCLR source pin (read-only)
        uses: actions/checkout@v4
        with:
          repository: night-outlook/hybridclr
          ref: 4b2774b066cfc6afd77a8c8aded6bda7ea574f55
          path: _hybrid_pinned
          filter: blob:none
          sparse-checkout: |
            hybridclr/metadata/Assembly.cpp
            hybridclr/metadata/StagedAssembly.cpp
            hybridclr/metadata/InterpreterImage.cpp
            hybridclr/metadata/InterpreterMetadataIndexRuntime.cpp
            hybridclr/metadata/InterpreterMetadataIndexCodec.h
          sparse-checkout-cone-mode: false
      - name: Verify cross-repository pinned call chain and fail-closed mutations
        shell: bash
        env:
          R03_B2_PINNED_NATIVE_ROOT: _native_pinned
          R03_B2_PINNED_HYBRIDCLR_ROOT: _hybrid_pinned
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s Tools/AssemblyShadow/R03IR/TypeDefCensus \
            -p 'test_verify_native_publication_mutex_chain.py' -v \
            2>&1 | tee "$RUNNER_TEMP/publication-mutex-tests.log"
          if grep -Eq 'skipped=[1-9]|FAILED|ERROR' "$RUNNER_TEMP/publication-mutex-tests.log"; then
            echo 'Actual pinned native/hybridclr source tests must not skip or fail'; exit 1
          fi
          python3 Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_native_publication_mutex_chain.py \
            --native-root _native_pinned --hybridclr-root _hybrid_pinned \
            --output "$RUNNER_TEMP/transitive-chain.json"
          python3 - "$RUNNER_TEMP/transitive-chain.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f:r=json.load(f)
          assert r['result']=='PinnedTransitivePublicationLocksOnly'
          assert r['nativeCommit']=='cecf4b859d50b128e5c0fc6c90cd89e3a452b96a'
          assert r['hybridclrCommit']=='4b2774b066cfc6afd77a8c8aded6bda7ea574f55'
          assert r['nativeFilesPinned']==3 and r['hybridclrFilesPinned']==5
          assert r['reviewedNestedLockDepth']==6
          assert r['shadowPublicationLockChain']==[
            'transaction.mutex','g_MetadataLock','s_assemblyLock',
            'UsageLock','reservationMutex','codec.mutex_']
          assert r['placeholderPublicationLockChain']==[
            'g_MetadataLock','s_assemblyLock','reservationMutex','codec.mutex_']
          assert r['runtimeBatchUsesReservationMutex'] is True
          assert r['codecPublishUsesInternalMutex'] is True
          assert r['singleImageUsesSameRuntimePublishBatch'] is True
          assert r['moduleInitializerAfterTransactionUnlock'] is True
          assert r['transitivePublicationPathStaticallyTraced'] is True
          for field in ('deadlockFreedomProven','allReverseEdgesExcluded',
                        'usageLockExceptionSafetyProven','shutdownDrainHasFiniteBound',
                        'classGcVmEpochProven','nativeCollectorIntegrated',
                        'realUnityEvidence','R03Accepted','H2Passed',
                        'ReadyForHumanReviewGate'):
              assert r[field] is False,field
          assert r['handoffAuthority']=='CLOSED_NO_LOCAL_EXECUTION'
          print('Pinned 2-repo publication mutex call chain PASS; not a runtime lock proof')
          PY
