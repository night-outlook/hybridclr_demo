name: R03 LI exact repair inputs
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths: ['.github/workflows/r03-li-source.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c16f39ec204876e3fd569f75c7b2e7dabc8c3913
          path: hybridclr_demo
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_unity
          ref: 11a20efadd8f1ebc494d02ac80135e224dabd3e5
          path: hybridclr_unity
          persist-credentials: false
      - name: Capture tracked source and bounded returned evidence without executing it
        shell: python
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'r03-li-inputs';out.mkdir()
          rows=[];repos={}
          prefixes=('Tools/','Assets/','Packages/','ProjectSettings/','.agents/','.github/','Docs/AssemblyShadow/Plan/','Docs/AssemblyShadow/Architecture/')
          history='Docs/AssemblyShadow/History/M07R/R03/'
          checkpoint=history+'local-validation-20261003-batch-i-return-required/'
          for repo in ('hybridclr_demo','hybridclr_unity'):
              repos[repo]=subprocess.check_output(['git','-C',repo,'rev-parse','HEAD'],text=True).strip()
              entries=subprocess.check_output(['git','-C',repo,'ls-files','-s','-z']).decode().split('\0')
              for entry in filter(None,entries):
                  header,path=entry.split('\t',1);mode,blob,stage=header.split()
                  selected=repo=='hybridclr_unity' or path.startswith(prefixes) or path in ('Docs/AssemblyShadow/README.md','Docs/AssemblyShadow/Handoff/WEB_TO_LOCAL.md') or path.startswith(history+'K_') or path.startswith(checkpoint+'preflight/issue-') or path==checkpoint+'preflight/PRIMARY_ISSUES.json' or path==checkpoint+'README.md' or path==checkpoint+'batch/focused-editor/results.xml' or path==history+'local-validation-20261001-batch-d-return-required/batch/editor-results.xml'
                  if not selected:continue
                  source=Path(repo)/path
                  assert mode=='100644' or mode=='100755',(repo,path,mode)
                  assert source.is_file() and not source.is_symlink(),(repo,path)
                  data=source.read_bytes()
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob
                  relative=repo+'/'+path;target=out/relative;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
                  rows.append({'path':relative,'gitBlob':blob,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (out/'provenance.json').write_text(json.dumps({'kind':'R03LIExactRepairInputs','workflowSource':os.environ['GITHUB_SHA'],'repositories':repos,'files':rows,'unityRun':False,'playerRun':False},indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r03-li-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/r03-li-inputs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
