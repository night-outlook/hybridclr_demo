name: R03 Primary four-repo host preflight
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - 'Tools/AssemblyShadow/R03IR/run_primary_host_preflight.py'
      - 'Tools/AssemblyShadow/R03/source-pins.json'
      - '.github/workflows/r03-primary-host-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-host-batch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: clang++
          - os: ubuntu-24.04
            compiler: g++
          - os: macos-15
            compiler: clang++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: r03-workspace/hybridclr_demo
          ref: codex/assembly-shadow-r01b-h1
          persist-credentials: false
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR
            Tools/AssemblyShadow/R03/source-pins.json
            Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/SNAP01_BOUNDED_DESIGN_f8a2/reference
            Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/N_SNAPSHOT_PUBLICATION_91b7/checks
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr
          path: r03-workspace/hybridclr
          ref: codex/assembly-shadow-r01b-h1
          persist-credentials: false
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_unity
          path: r03-workspace/hybridclr_unity
          ref: codex/assembly-shadow-r01b-h1
          persist-credentials: false
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/il2cpp_plus
          path: r03-workspace/il2cpp_plus
          ref: codex/assembly-shadow-r01b-h1
          persist-credentials: false
          sparse-checkout: |
            libil2cpp/vm
            tools/r03/diagnostic_stream
          sparse-checkout-cone-mode: false
      - name: Pin sources, validate runner Python syntax and execute all host suites
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/r03-workspace/hybridclr_demo"
          python3 -B - <<'PY'
          from pathlib import Path
          p=Path('Tools/AssemblyShadow/R03IR/run_primary_host_preflight.py')
          compile(p.read_text(), str(p), 'exec')
          PY
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('Tools/AssemblyShadow/R03/source-pins.json').read_text())
          assert p['il2cpp_plus']=='74dbdbea80d83923863303bd2b2c0a87f36541b1'
          assert p['hybridclr']=='4b2774b066cfc6afd77a8c8aded6bda7ea574f55'
          assert p['hybridclr_unity']=='948c0e3b4f8891481301770115e8ba4945eea6de'
          PY
          output="$RUNNER_TEMP/r03-host-preflight-${{ github.run_id }}-${{ github.run_attempt }}"
          python3 -B Tools/AssemblyShadow/R03IR/run_primary_host_preflight.py \
            --workspace "$GITHUB_WORKSPACE/r03-workspace" \
            --expected-demo "$GITHUB_SHA" \
            --expected-native 74dbdbea80d83923863303bd2b2c0a87f36541b1 \
            --output "$output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-primary-host-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.sha }}
          path: ${{ runner.temp }}/r03-host-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
