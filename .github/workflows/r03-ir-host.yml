name: R03 independent-review terminal host contracts
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-ir-host.yml'
      - 'Tools/AssemblyShadow/R03IR/**'
permissions:
  contents: read
jobs:
  python-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile Python syntax without modifying source tree
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          paths=sorted(Path('Tools/AssemblyShadow/R03IR').glob('*.py'))
          assert paths and any(p.name == 'run_terminal_local.py' for p in paths)
          for p in paths: ast.parse(p.read_text(), filename=str(p))
          print('R03 IR Python AST syntax: Passed',len(paths))
          PY
      - name: Execute strict host contract regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/r03-ir"
          python3 -B -m unittest discover -s Tools/AssemblyShadow/R03IR -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/r03-ir/host-tests.log"
          git diff --check
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-ir-host-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/r03-ir
          retention-days: 14
          if-no-files-found: warn
