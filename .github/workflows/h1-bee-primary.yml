name: H1 Bee primary fixture and tools
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/h1-bee-primary.yml'
      - 'Tools/AssemblyShadow/h1_*.py'
      - 'Tools/AssemblyShadow/freeze-h1-performance-build-map.py'
      - 'Tools/AssemblyShadow/verify-h1-protected-reference.py'
      - 'Tools/AssemblyShadow/verify-h1-compiler-provenance-strict.py'
      - 'Tools/AssemblyShadow/tests/test_h1_*.py'
      - 'Tools/AssemblyShadow/r01_*.py'
      - 'Tools/AssemblyShadow/run-r01-failure-players.py'
      - 'Tools/AssemblyShadow/tests/test_r01_*.py'
      - 'Tools/AssemblyShadow/r01b_*.py'
      - 'Tools/AssemblyShadow/run-r01b-lazy-player.py'
      - 'Tools/AssemblyShadow/tests/test_r01b_*.py'
      - 'Assets/AssemblyShadowDemo/Bootstrap/R01FailureProbe.cs'
      - 'Assets/AssemblyShadowR01BDiagnostics/Runtime/R01BLazyProbe.cs'
      - 'Assets/AssemblyShadowDemo/Tests/Editor/R01BLazyDiagnosticTests.cs'
      - 'Assets/AssemblyShadowDemo/Editor/H1CompilerProvenance.cs'
      - 'Docs/AssemblyShadow/Handoff/WEB_TO_LOCAL.md'
      - 'Docs/AssemblyShadow/Handoff/source-targets.json'
      - 'ProjectSettings/AssemblyShadowSourcePins.json'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticate immutable failure fixture
        run: python3 Tools/AssemblyShadow/h1_bee_fixture_export.py --output "$RUNNER_TEMP/h1-bee-fixture"
      - name: Run exact Primary regression suite
        env:
          H1_BEE_FIXTURE_DIR: ${{ runner.temp }}/h1-bee-fixture
          PYTHONPATH: Tools/AssemblyShadow
        run: python3 Tools/AssemblyShadow/h1_bee_primary_tests.py --output "$RUNNER_TEMP/h1-bee-fixture/test-results"
      - name: Verify committed live H1 handoff
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 Tools/AssemblyShadow/tests/test_h1_handoff_preflight.py
      - name: Run R01 early and failure/publication contract regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 Tools/AssemblyShadow/tests/test_r01_early_capsule.py
          python3 Tools/AssemblyShadow/tests/test_r01_early_results.py
          python3 Tools/AssemblyShadow/tests/test_r01_failure_pipeline.py
      - name: Run R01B lazy contract regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 Tools/AssemblyShadow/tests/test_r01b_lazy_result.py
      - name: Export reviewed source inputs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/h1-bee-fixture/source"
          cp -R Tools/AssemblyShadow "$RUNNER_TEMP/h1-bee-fixture/source/"
          cp Assets/AssemblyShadowDemo/Editor/H1CompilerProvenance.cs "$RUNNER_TEMP/h1-bee-fixture/source/"
          git rev-parse HEAD > "$RUNNER_TEMP/h1-bee-fixture/source-head.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h1-bee-primary-${{ github.sha }}
          path: ${{ runner.temp }}/h1-bee-fixture
          retention-days: 7
          if-no-files-found: error
