name: H1 Bee primary fixture and tools
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/h1-bee-primary.yml'
      - 'Tools/AssemblyShadow/README.md'
      - 'Tools/AssemblyShadow/R02/legacy_scope.py'
      - 'Tools/AssemblyShadow/R02/tests/test_legacy_scope.py'
      - 'Tools/AssemblyShadow/h1_*.py'
      - 'Tools/AssemblyShadow/freeze-h1-performance-build-map.py'
      - 'Tools/AssemblyShadow/bind-h1-performance-preregistration.py'
      - 'Tools/AssemblyShadow/run-h1-paired-performance.py'
      - 'Tools/AssemblyShadow/run-h1-formal-batch.py'
      - 'Tools/AssemblyShadow/seal-h1-pilot-verification.py'
      - 'Tools/AssemblyShadow/verify-h1-retained-early-reuse.py'
      - 'Tools/AssemblyShadow/verify-h1-retained-pilot-admission.py'
      - 'Tools/AssemblyShadow/create-h1-graph-reuse-bridge.py'
      - 'Tools/AssemblyShadow/r00_player_inputs.py'
      - 'Tools/AssemblyShadow/r00_results.py'
      - 'Tools/AssemblyShadow/run-r00-players.py'
      - 'Tools/AssemblyShadow/r01_early_results.py'
      - 'Tools/AssemblyShadow/analyze-h1-paired-performance.py'
      - 'Tools/AssemblyShadow/verify-h1-protected-reference.py'
      - 'Tools/AssemblyShadow/verify-h1-compiler-provenance-strict.py'
      - 'Tools/AssemblyShadow/tests/test_h1_*.py'
      - 'Tools/AssemblyShadow/tests/test_m07_generated_input_recovery_labels.ps1'
      - 'Tools/AssemblyShadow/tests/test_m07_player_input_recovery.ps1'
      - 'Tools/AssemblyShadow/r01_*.py'
      - 'Tools/AssemblyShadow/run-r01-failure-players.py'
      - 'Tools/AssemblyShadow/tests/test_r01_*.py'
      - 'Tools/AssemblyShadow/r01b_*.py'
      - 'Tools/AssemblyShadow/run-r01b-lazy-player.py'
      - 'Tools/AssemblyShadow/tests/test_r01b_*.py'
      - 'Tools/AssemblyShadow/Invoke-M07Build.ps1'
      - 'Tools/AssemblyShadow/Invoke-M07Build.Core.ps1'
      - 'Assets/AssemblyShadowDemo/Bootstrap/R01EarlyStartup.cs'
      - 'Assets/AssemblyShadowDemo/Bootstrap/R01FailureProbe.cs'
      - 'Assets/AssemblyShadowDemo/Tests/Editor/R01EarlyStartupTests.cs'
      - 'Assets/AssemblyShadowDemo/Tests/Editor/M07BuildTests.cs'
      - 'Assets/AssemblyShadowR01BDiagnostics/Runtime/R01BLazyProbe.cs'
      - 'Assets/AssemblyShadowDemo/Tests/Editor/R01BLazyDiagnosticTests.cs'
      - 'Assets/AssemblyShadowDemo/Editor/H1CompilerProvenance.cs'
      - 'Assets/AssemblyShadowDemo/Editor/H1BuildInputProvenance.cs'
      - 'Docs/AssemblyShadow/Handoff/WEB_TO_LOCAL.md'
      - 'Docs/AssemblyShadow/Handoff/source-targets.json'
      - 'ProjectSettings/AssemblyShadowSourcePins.json'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticate immutable failure fixture
        run: python3 Tools/AssemblyShadow/h1_bee_fixture_export.py --output "$RUNNER_TEMP/h1-bee-fixture"
      - name: Run current reusable contracts and explicit H1 rejection tests
        env:
          H1_BEE_FIXTURE_DIR: ${{ runner.temp }}/h1-bee-fixture
          PYTHONPATH: Tools/AssemblyShadow
        run: python3 Tools/AssemblyShadow/R02/legacy_scope.py --project "$GITHUB_WORKSPACE" --current-root "$GITHUB_WORKSPACE" --scope current --output "$RUNNER_TEMP/h1-bee-fixture/current-results"
      - name: Run six immutable H1 positive fixtures separately
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          H1_BEE_FIXTURE_DIR: ${{ runner.temp }}/h1-bee-fixture
        run: |
          # Disposable local fixture, not a live branch or a Player source.
          historical="$RUNNER_TEMP/h1-positive-checkout"
          git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$historical"
          git -C "$historical" checkout -b codex/assembly-shadow-r01b-h1 2cbf68658a5b73189930fcdfe250835b72639515
          git -C "$historical" remote set-url origin https://github.com/night-outlook/hybridclr_demo.git
          python3 Tools/AssemblyShadow/R02/legacy_scope.py --project "$historical" --current-root "$GITHUB_WORKSPACE" --scope historical --output "$RUNNER_TEMP/h1-bee-fixture/fixed-h1-results"
      - name: Run R01 early and failure/publication contract regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 Tools/AssemblyShadow/tests/test_r01_early_capsule.py
          python3 Tools/AssemblyShadow/tests/test_r01_early_launch.py
          python3 Tools/AssemblyShadow/tests/test_r01_early_results.py
          python3 Tools/AssemblyShadow/tests/test_r01_failure_pipeline.py
      - name: Run M07 PowerShell recovery regressions
        shell: pwsh
        run: |
          ./Tools/AssemblyShadow/tests/test_m07_generated_input_recovery_labels.ps1
          ./Tools/AssemblyShadow/tests/test_m07_player_input_recovery.ps1
      - name: Run R01B lazy contract regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 Tools/AssemblyShadow/tests/test_r01b_lazy_result.py
      - name: Export reviewed source inputs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/h1-bee-fixture/source"
          cp -R Tools/AssemblyShadow "$RUNNER_TEMP/h1-bee-fixture/source/"
          cp Assets/AssemblyShadowDemo/Editor/H1CompilerProvenance.cs "$RUNNER_TEMP/h1-bee-fixture/source/"
          git rev-parse HEAD > "$RUNNER_TEMP/h1-bee-fixture/source-head.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h1-bee-primary-${{ github.sha }}
          path: ${{ runner.temp }}/h1-bee-fixture
          retention-days: 7
          if-no-files-found: error
