name: R03 B2 D2 native publication custody host (NOT Unity)
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/extract_d2_native_custody.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/test_extract_d2_native_custody.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/D2NativeCustodyHost.cpp
      - .github/workflows/r03-b2-d2-native-custody-host.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-native-d2-custody:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        standard: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: Tools/AssemblyShadow/R03IR/TypeDefCensus
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: b86a97e1dcca18163df5ac2d5f268bf6de18bbdf
          path: _native_d2
          filter: blob:none
          sparse-checkout: |
            libil2cpp/vm/Assembly.cpp
            libil2cpp/vm/MetadataCache.cpp
            libil2cpp/vm/AssemblyShadow.cpp
            libil2cpp/vm/Assembly.h
            libil2cpp/vm/MetadataCache.h
            libil2cpp/utils/dynamic_array.h
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate exact native D2 blobs, run mutations, extract unmodified bodies
        shell: bash
        env:
          R03_B2_D2_NATIVE_ROOT: ${{ github.workspace }}/_native_d2
        run: |
          set -euo pipefail
          test "$(git -C "$R03_B2_D2_NATIVE_ROOT" rev-parse HEAD)" = 'b86a97e1dcca18163df5ac2d5f268bf6de18bbdf'
          dir=Tools/AssemblyShadow/R03IR/TypeDefCensus
          python3 "$dir/test_extract_d2_native_custody.py" -v 2>&1 | tee "$RUNNER_TEMP/d2-tests.log"
          grep -q 'Ran 18 tests' "$RUNNER_TEMP/d2-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/d2-tests.log"
          if grep -E 'skipped=|FAILED|ERROR:' "$RUNNER_TEMP/d2-tests.log"; then exit 1; fi
          python3 "$dir/extract_d2_native_custody.py" \
            --native-root "$R03_B2_D2_NATIVE_ROOT" \
            --output "$RUNNER_TEMP/D2ExactNativeBodies.inc" \
            --receipt "$RUNNER_TEMP/d2-source.json"
          cat "$RUNNER_TEMP/d2-source.json"
          python3 - "$RUNNER_TEMP/d2-source.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf8') as f:d=json.load(f)
          assert d['schema']=='R03B2D2NativeCustodyExactExtractV1'
          assert d['result']=='PinnedD2NativeSourceBodiesExtractedOnly'
          assert d['nativeCommit']=='b86a97e1dcca18163df5ac2d5f268bf6de18bbdf'
          assert d['bodyCount']==14 and len(d['sourceBlobs'])==5
          assert len(d['bodies'])==14
          assert d['handoffAuthority']=='CLOSED_NO_LOCAL_EXECUTION'
          for k in ('nativeProductionModifiedByTest','runtimeCodecReal','realUnity','R03Accepted','H2Passed','ReadyForHumanReviewGate'): assert d[k] is False,k
          PY
      - name: Run strict, sanitizer and no-exceptions host profiles
        shell: bash
        env:
          STANDARD: ${{ matrix.standard }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then cxx=clang++; else cxx=g++; fi
          dir=Tools/AssemblyShadow/R03IR/TypeDefCensus
          for profile in strict sanitized no-exceptions; do
            flags=(-O2)
            if [[ "$profile" == sanitized ]]; then flags=(-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer); fi
            scenarios=(used-denial normal-false normal-success cli-append-exception usage-acquired-exception staged-exception post-stage-exception prior-first-error)
            if [[ "$profile" == no-exceptions ]]; then
              flags=(-O2 -DD2_NO_EXCEPTIONS -fno-exceptions -fno-rtti)
              scenarios=(used-denial normal-false normal-success)
            fi
            "$cxx" -std="$STANDARD" "${flags[@]}" -Wall -Wextra -Werror -pedantic -pthread \
              -I "$RUNNER_TEMP" "$dir/D2NativeCustodyHost.cpp" -o "$RUNNER_TEMP/d2-host"
            for scenario in "${scenarios[@]}"; do
              ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
                "$RUNNER_TEMP/d2-host" "$scenario" > "$RUNNER_TEMP/result.json"
              cat "$RUNNER_TEMP/result.json"
              python3 - "$RUNNER_TEMP/result.json" "$scenario" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf8') as f:d=json.load(f)
          assert d['schema']=='R03B2D2NativeCustodyHostV1'
          assert d['result']=='PassedPinnedD2CustodyHostOnly' and d['case']==sys.argv[2]
          assert d['checks']>=13
          assert d['compiledPinnedNativeBodies'] is True
          assert d['usageReleasedBeforeAssemblyUnlock'] is True
          assert d['sourceNativeCommit']=='b86a97e1dcca18163df5ac2d5f268bf6de18bbdf'
          assert d['mockNativeDependencies'] is True and d['nativeProductionSourceChanged'] is True
          for k in ('nativeRuntimeCodecActual','unityPlayerExecuted','postCodecRollbackProven','R03Accepted','H2Passed','ReadyForHumanReviewGate'): assert d[k] is False,k
          print('D2 literal native custody host PASS, NOT Player acceptance')
          PY
            done
          done

      - name: Compile D2 publisher with exact pinned native CLI dynamic_array header
        shell: bash
        env:
          STANDARD: ${{ matrix.standard }}
        run: |
          set -euo pipefail
          root=_native_d2
          source=libil2cpp/utils/dynamic_array.h
          expected=0e6653e6e7efe93f023f63893c1a3b94f347a1d0
          test "$(git -C "$root" rev-parse HEAD)" = 'b86a97e1dcca18163df5ac2d5f268bf6de18bbdf'
          test "$(git -C "$root" rev-parse "HEAD:$source")" = "$expected"
          test "$(git -C "$root" hash-object "$source")" = "$expected"
          cp "$root/$source" "$RUNNER_TEMP/PinnedNativeDynamicArray.h"
          # Only allocator macros and C++ assertions are host stand-ins.
          # The tested dynamic_array template source remains byte-for-byte native.
          cat > "$RUNNER_TEMP/Memory.h" <<'SHIM'
          #pragma once
          #include <cstddef>
          #include <cstdlib>
          #include <cstring>
          #include <cassert>
          #define ALIGN_OF(T) alignof(T)
          #define Assert(expr) assert(expr)
          #define IL2CPP_DEBUG 0
          static unsigned d2HostReallocationCount = 0;
          inline void* D2HostAlignedRealloc(void* p, size_t n, size_t) {
              ++d2HostReallocationCount;
              return std::realloc(p,n);
          }
          #define IL2CPP_MALLOC_ALIGNED(bytes,alignment) std::malloc(bytes)
          #define IL2CPP_FREE_ALIGNED(ptr) std::free(ptr)
          #define IL2CPP_REALLOC_ALIGNED(ptr,bytes,alignment) D2HostAlignedRealloc(ptr,bytes,alignment)
          SHIM
          if [[ "$RUNNER_OS" == macOS ]]; then cxx=clang++; else cxx=g++; fi
          dir=Tools/AssemblyShadow/R03IR/TypeDefCensus
          for profile in strict sanitized no-exceptions; do
            flags=(-O2 -DD2_REAL_CLI)
            scenarios=(used-denial normal-false normal-success usage-acquired-exception staged-exception post-stage-exception prior-first-error)
            if [[ "$profile" == sanitized ]]; then
              flags=(-O1 -g -DD2_REAL_CLI -fsanitize=address,undefined -fno-omit-frame-pointer)
            fi
            if [[ "$profile" == no-exceptions ]]; then
              flags=(-O2 -DD2_REAL_CLI -DD2_NO_EXCEPTIONS -fno-exceptions -fno-rtti)
              scenarios=(used-denial normal-false normal-success)
            fi
            "$cxx" -std="$STANDARD" "${flags[@]}" -Wall -Wextra -Werror -pedantic -pthread \
              -I "$RUNNER_TEMP" "$dir/D2NativeCustodyHost.cpp" -o "$RUNNER_TEMP/d2-realcli-host"
            for scenario in "${scenarios[@]}"; do
              ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
                "$RUNNER_TEMP/d2-realcli-host" "$scenario" > "$RUNNER_TEMP/realcli.json"
              cat "$RUNNER_TEMP/realcli.json"
              python3 - "$RUNNER_TEMP/realcli.json" "$scenario" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf8') as f:d=json.load(f)
          assert d['schema']=='R03B2D2NativeCustodyHostV1'
          assert d['result']=='PassedPinnedD2CustodyHostOnly' and d['case']==sys.argv[2]
          assert d['realCliDynamicArraySource'] is True
          # The prior-first-error case has 13 assertions; its primary
          # evidence is the native latch's no-overwrite guarantee.
          assert d['checks']>=13 and d['compiledPinnedNativeBodies'] is True
          assert d['sourceNativeCommit']=='b86a97e1dcca18163df5ac2d5f268bf6de18bbdf'
          assert d['usageReleasedBeforeAssemblyUnlock'] is True
          for k in ('nativeRuntimeCodecActual','unityPlayerExecuted','postCodecRollbackProven','R03Accepted','H2Passed','ReadyForHumanReviewGate'): assert d[k] is False,k
          print('Pinned real CLI dynamic_array + D2 native bodies: PASS, no Unity')
          PY
            done
          done
