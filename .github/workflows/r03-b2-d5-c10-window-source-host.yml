name: R03 B2 D5 C10 window native source-host (NO UNITY)
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - Tools/AssemblyShadow/R03IR/D5Probe/**
      - .github/workflows/r03-b2-d5-c10-window-source-host.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-d5-window-host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        cpp: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          path: _d5demo
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/D5Probe/
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: c741fb32a2b770856f211f47305c4f86b51f54ce
          path: _d5native
          filter: blob:none
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadow.cpp
            libil2cpp/vm/AssemblyShadowD5WindowProbe.h
            libil2cpp/vm/AssemblyShadowProcessSnapshotOwner.h
            libil2cpp/vm/AssemblyShadow.h
            libil2cpp/vm/AssemblyShadowFirstFailureV2.h
            libil2cpp/vm/AssemblyShadowPublicationD3Decision.h
            libil2cpp/vm/AssemblyShadowPublicationPhaseReceipt.h
            libil2cpp/vm/AssemblyShadowTerminalExecution.h
            libil2cpp/vm/AssemblyShadowTypes.h
            libil2cpp/vm/Assembly.cpp
            libil2cpp/vm/MetadataCache.cpp
            libil2cpp/vm/Runtime.cpp
            libil2cpp/utils/dynamic_array.h
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exact native source and managed test candidate contracts
        env:
          R03_D5C10_NATIVE_ROOT: ${{ github.workspace }}/_d5native
          R03_D5C10_DEMO_ROOT: ${{ github.workspace }}/_d5demo
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          tool=_d5demo/Tools/AssemblyShadow/R03IR/D5Probe
          python3 -B "$tool/test_d5_window_source_contract.py" -v 2>&1 | tee "$RUNNER_TEMP/source-tests.log"
          grep -q 'Ran 59 tests in' "$RUNNER_TEMP/source-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/source-tests.log"
          python3 -B "$tool/d5_window_source_contract.py" \
            --native-root "$GITHUB_WORKSPACE/_d5native" \
            --demo-root "$GITHUB_WORKSPACE/_d5demo" \
            --expected-native-head c741fb32a2b770856f211f47305c4f86b51f54ce \
            --expected-demo-head "$GITHUB_SHA" | tee "$RUNNER_TEMP/source-receipt.json"
          grep -q 'PassedActualSourceContractOnly_NotUnityPlayer' "$RUNNER_TEMP/source-receipt.json"
      - name: Synthetic native install, object and link material checks
        env:
          R03_D5C10_NATIVE_ROOT: ${{ github.workspace }}/_d5native
          R03_D5C10_DEMO_ROOT: ${{ github.workspace }}/_d5demo
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          tool=_d5demo/Tools/AssemblyShadow/R03IR/D5Probe
          python3 -B "$tool/test_d5_link_materials.py" -v 2>&1 | tee "$RUNNER_TEMP/link-tests.log"
          grep -q 'Ran 27 tests in' "$RUNNER_TEMP/link-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/link-tests.log"
          python3 -B "$tool/d5_link_materials.py" --source-preview-only | tee "$RUNNER_TEMP/link-preview.json"
          grep -q 'SourceOnlyProvenanceContract_NotRun' "$RUNNER_TEMP/link-preview.json"
          python3 -B "$tool/test_d5_c10_native_receipt.py" -v 2>&1 | tee "$RUNNER_TEMP/evidence-tests.log"
          grep -q 'Ran 34 tests in' "$RUNNER_TEMP/evidence-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/evidence-tests.log"
          python3 -B "$tool/d5_c10_native_receipt.py" | tee "$RUNNER_TEMP/evidence-preview.json"
          grep -q 'SourceHostOnly_NoRealPlayerEvidence' "$RUNNER_TEMP/evidence-preview.json"
      - name: Compile exact C++11/17 native witness, test overlay and OFF control
        shell: bash
        run: |
          set -euo pipefail
          source=_d5demo/Tools/AssemblyShadow/R03IR/D5Probe
          native=_d5native/libil2cpp
          mkdir -p "$RUNNER_TEMP/d5-c10-host"
          args=(-std=${{ matrix.cpp }} -Wall -Wextra -Werror -pedantic -pthread \
            -DHYBRIDCLR_ENABLE_ASSEMBLY_SHADOW=1 \
            -DHYBRIDCLR_R03_D5_WINDOW_PROBE=1 \
            -I "$native" -I "$source/NativeHostStubs")
          clang++ "${args[@]}" -fno-exceptions -fno-rtti \
            "$source/D5WindowSourceHost.cpp" "$source/D5WindowOtherTU.cpp" \
            "$source/R03D5WindowOverlay.cpp" -o "$RUNNER_TEMP/d5-c10-host/strict"
          for case in unarmed denied allowed timeout raced invalid foreign wrongmethod duplicate early_terminal canary_happens_before; do
            "$RUNNER_TEMP/d5-c10-host/strict" "$case" | tee -a "$RUNNER_TEMP/d5-c10-host/strict.log"
          done
          test "$(grep -c 'PassedExactNativeWindowHeaderAndOverlayHostOnly' "$RUNNER_TEMP/d5-c10-host/strict.log")" -eq 11
          clang++ "${args[@]}" -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined \
            "$source/D5WindowSourceHost.cpp" "$source/D5WindowOtherTU.cpp" \
            "$source/R03D5WindowOverlay.cpp" -o "$RUNNER_TEMP/d5-c10-host/sanitized"
          export ASAN_OPTIONS=detect_leaks=0
          for case in unarmed denied allowed timeout raced invalid foreign wrongmethod duplicate early_terminal canary_happens_before; do
            "$RUNNER_TEMP/d5-c10-host/sanitized" "$case" | tee -a "$RUNNER_TEMP/d5-c10-host/sanitized.log"
          done
          test "$(grep -c 'PassedExactNativeWindowHeaderAndOverlayHostOnly' "$RUNNER_TEMP/d5-c10-host/sanitized.log")" -eq 11
          clang++ -std=${{ matrix.cpp }} -Wall -Wextra -Werror -pedantic -pthread \
            -DHYBRIDCLR_ENABLE_ASSEMBLY_SHADOW=0 \
            -DHYBRIDCLR_R03_D5_WINDOW_PROBE=0 \
            -I "$native" -I "$source/NativeHostStubs" \
            "$source/D5WindowFeatureOffHost.cpp" "$source/R03D5WindowOverlay.cpp" \
            -o "$RUNNER_TEMP/d5-c10-host/feature-off"
          "$RUNNER_TEMP/d5-c10-host/feature-off" | tee "$RUNNER_TEMP/d5-c10-host/feature-off.log"
          clang++ "${args[@]}" -fno-exceptions -fno-rtti \
            "$source/D5NativeReceiptHost.cpp" "$source/R03D5WindowOverlay.cpp" \
            -o "$RUNNER_TEMP/d5-c10-host/receipt-strict"
          "$RUNNER_TEMP/d5-c10-host/receipt-strict" "$RUNNER_TEMP/d5-c10-host/native-receipt-strict.bin"
          clang++ "${args[@]}" -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined \
            "$source/D5NativeReceiptHost.cpp" "$source/R03D5WindowOverlay.cpp" \
            -o "$RUNNER_TEMP/d5-c10-host/receipt-sanitized"
          "$RUNNER_TEMP/d5-c10-host/receipt-sanitized" "$RUNNER_TEMP/d5-c10-host/native-receipt-sanitized.bin"
          # Pure source-host auto-collector exercises the real background
          # writer loop with synthetic state/field/first-error adapters.
          clang++ "${args[@]}" -DHYBRIDCLR_R03_D5_SOURCE_HOST_AUTO=1 \
            -fno-exceptions -fno-rtti \
            "$source/D5AutoReceiptHost.cpp" "$source/R03D5WindowOverlay.cpp" \
            -o "$RUNNER_TEMP/d5-c10-host/auto-strict"
          for case in denied allowed foreign wrongmethod raced noattempt io_pwrite io_fsync io_close io_dirsync; do
            "$RUNNER_TEMP/d5-c10-host/auto-strict" "$case" \
              "$RUNNER_TEMP/d5-c10-host/auto-strict-$case.bin" |
              tee -a "$RUNNER_TEMP/d5-c10-host/auto-strict.log"
          done
          test "$(grep -c 'PassedD5NativeAutoCollectorHostOnly' "$RUNNER_TEMP/d5-c10-host/auto-strict.log")" -eq 10
          clang++ "${args[@]}" -DHYBRIDCLR_R03_D5_SOURCE_HOST_AUTO=1 \
            -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined \
            "$source/D5AutoReceiptHost.cpp" "$source/R03D5WindowOverlay.cpp" \
            -o "$RUNNER_TEMP/d5-c10-host/auto-sanitized"
          for case in denied allowed foreign wrongmethod raced noattempt io_pwrite io_fsync io_close io_dirsync; do
            "$RUNNER_TEMP/d5-c10-host/auto-sanitized" "$case" \
              "$RUNNER_TEMP/d5-c10-host/auto-sanitized-$case.bin" |
              tee -a "$RUNNER_TEMP/d5-c10-host/auto-sanitized.log"
          done
          test "$(grep -c 'PassedD5NativeAutoCollectorHostOnly' "$RUNNER_TEMP/d5-c10-host/auto-sanitized.log")" -eq 10
          export D5_SOURCE_HOST_TOOL="$source"
          export D5_SOURCE_HOST_OUTPUT="$RUNNER_TEMP/d5-c10-host"
          python3 -B - <<'PY'
          import json
          import os
          import struct
          import sys
          from pathlib import Path
          sys.path.insert(0, os.environ["D5_SOURCE_HOST_TOOL"])
          from d5_c10_native_receipt import parse_material
          root = Path(os.environ["D5_SOURCE_HOST_OUTPUT"])
          expectations = {
              "denied": "CandidateObservedDeniedInP5_RequiresIndependentBinaryProof",
              "allowed": "UnsafeEarlyMethodAdmissionObserved_SourceMaterial",
              "foreign": "NoCoverage",
              "wrongmethod": "NoCoverage",
              "raced": "NoCoverage",
              "noattempt": "NoCoverage",
              "io_pwrite": None,    # never published
              "io_fsync": None,     # never published
              "io_close": None,     # never published
              "io_dirsync": "NoCoverage", # final exists, exit 2 must reject
          }
          for profile in ("strict", "sanitized"):
              records = [json.loads(line) for line in
                  (root / f"auto-{profile}.log").read_text().splitlines()]
              records = {row["scenario"]: row for row in records}
              assert len(records)==len(expectations)
              for case, expected in expectations.items():
                  path = root / f"auto-{profile}-{case}.bin"
                  mock_exit = records[case]["mockExitCode"]
                  if expected is None:
                      assert not path.exists(), (profile, case, "published failed receipt")
                      assert mock_exit==2
                  else:
                      raw = path.read_bytes()
                      # Explicitly fabricated host-only process join. A real
                      # Player needs INDEPENDENT PID/exit/binary provenance.
                      mock_pid = struct.unpack_from("<8sii", raw)[2]
                      value = parse_material(raw,
                          externally_observed_pid=mock_pid,
                          externally_observed_exit_code=mock_exit)
                      assert value["result"] == expected, (profile, case, value)
                      assert not value["realPlayerC10Passed"]
                      assert not value["actualLinkedBinaryAndPidAuthenticated"]
                      assert not value["externalProcessProvenanceIndependentlyVerified"]
                  print("PassedSyntheticNativeAutoCollectorReceipt", profile, case, expected or "UnpublishedFailure")
          PY
          echo '{"schema":"R03D5C10HostMatrixV1","result":"HostOnly","nativeStrictCases":11,"nativeSanitizedCases":11,"nativeReceiptStrictCases":1,"nativeReceiptSanitizedCases":1,"nativeAutoStrictCases":10,"nativeAutoSanitizedCases":10,"featureOffCases":1,"realUnityPlayerExecuted":false,"actualIL2CPPCompiled":false,"D5BLocalExecution":"NotAuthorized","WEB_TO_LOCAL":"CLOSED_NO_LOCAL_EXECUTION","R03Accepted":false}'
