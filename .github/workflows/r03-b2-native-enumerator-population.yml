name: R03 B2 actual native enumerator population source audit (NOT Unity)
on:
  push:
    branches:
      - codex/assembly-shadow-r01b-h1
    paths:
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_native_enumerator_population.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/test_verify_native_enumerator_population.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_native_source_path_boundary.py
      - .github/workflows/r03-b2-native-enumerator-population.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-population-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/TypeDefCensus
          sparse-checkout-cone-mode: true
      - name: Read-only exact il2cpp_plus checkout
        uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: cecf4b859d50b128e5c0fc6c90cd89e3a452b96a
          path: _native_pinned
          filter: blob:none
          sparse-checkout: |
            libil2cpp/il2cpp-api.cpp
            libil2cpp/vm/MemoryInformation.cpp
            libil2cpp/vm/Assembly.cpp
            libil2cpp/vm/AssemblyShadowOriginalV1ImageScan.h
            libil2cpp/vm/GlobalMetadata.cpp
            libil2cpp/metadata/GenericMetadata.cpp
            libil2cpp/metadata/ArrayMetadata.cpp
            libil2cpp/vm/MetadataCache.cpp
            libil2cpp/vm/Runtime.cpp
            libil2cpp/vm/AssemblyShadowMetadataLifetime.h
            libil2cpp/vm/AssemblyShadowBoundedDefinitionExecutionLiveSource.inl
          sparse-checkout-cone-mode: false
      - name: Audit exact native population split and test negative mutations
        shell: bash
        env:
          R03_B2_PINNED_NATIVE_ROOT: _native_pinned
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Tools/AssemblyShadow/R03IR/TypeDefCensus \
            -p 'test_verify_native_enumerator_population.py' -v \
            2>&1 | tee "$RUNNER_TEMP/enum-tests.log"
          if grep -Eq 'skipped=[1-9]|FAILED|ERROR' "$RUNNER_TEMP/enum-tests.log"; then
            echo 'A source test was skipped or failed' >&2; exit 1
          fi
          python3 Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_native_enumerator_population.py \
            --native-root _native_pinned --output "$RUNNER_TEMP/enum-population.json"
          python3 - "$RUNNER_TEMP/enum-population.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: r=json.load(f)
          assert r['result']=='PinnedSourcePopulationMismatchOnly'
          assert r['nativeCommit']=='cecf4b859d50b128e5c0fc6c90cd89e3a452b96a'
          assert r['nativeFilesVerified']==11 and len(r['exactSourceGitBlobs'])==11
          assert r['publicClassReportPassesInB2']==3
          assert r['originalPhysicalImagePassesInB2']==2
          assert r['publicDefinitionLookupRequiresInitializedCachedClass'] is True
          assert r['physicalTokenValidImagesIncludeInterpreterAndZeroTypeDef'] is True
          assert r['separateCacheWalkers']==['array','szarray','generic','pointer']
          for field in ('physicalAndPublicPopulationEquivalenceProven',
                        'realPhysicalTypeDefUpperBoundMeasured',
                        'realObservedTypeDefUsePopulationMeasured',
                        'realRejectedTypeDefPathsObserved',
                        'classGcMetadataEpochProven',
                        'fullOriginalV1Fields14And15Proven',
                        'nativeV2TransportImplemented', 'realUnityEvidence',
                        'R03Accepted','H2Passed','ReadyForHumanReviewGate'):
              assert r[field] is False,field
          assert r['handoffAuthority']=='CLOSED_NO_LOCAL_EXECUTION'
          print('Pinned native population source distinction PASS; not Unity/runtime evidence')
          PY
