name: R03 remaining witness host-only semantic contracts
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-ir-remaining-witness-host.yml'
      - 'Tools/AssemblyShadow/R03IR/remaining_witness_contracts.py'
      - 'Tools/AssemblyShadow/R03IR/test_remaining_witness_contracts.py'
permissions:
  contents: read
jobs:
  remaining-witness-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/remaining_witness_contracts.py
            Tools/AssemblyShadow/R03IR/test_remaining_witness_contracts.py
      - name: Compile and run synthetic remaining-witness semantic tests
        shell: bash
        run: |
          python3 -B -m py_compile \
            Tools/AssemblyShadow/R03IR/remaining_witness_contracts.py \
            Tools/AssemblyShadow/R03IR/test_remaining_witness_contracts.py
          PYTHONPATH=Tools/AssemblyShadow/R03IR \
            python3 -B -m unittest discover \
              -s Tools/AssemblyShadow/R03IR \
              -p test_remaining_witness_contracts.py -v
          echo "HOST-ONLY: No native snapshot, Unity, Player or R03 acceptance"
