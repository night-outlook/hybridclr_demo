name: R03 B2 TypeDef source path coverage replay (host only)
on:
  push:
    branches:
      - codex/assembly-shadow-r01b-h1
    paths:
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/TypeDefSourceCoverageReplay.h
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/TypeDefSourceCoverageReplayHost.cpp
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/OriginalV1OwnerSourceAdapter.h
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/BoundedNativeCensusProducer.h
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/analyze_typedef_census.py
      - Tools/AssemblyShadow/R03IR/CapacityCandidates/BoundedHandlePatriciaIndex.h
      - .github/workflows/r03-b2-typedef-source-coverage-host.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-coverage-replay:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        standard: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/TypeDefCensus
            Tools/AssemblyShadow/R03IR/CapacityCandidates
          sparse-checkout-cone-mode: true
      - name: Test fail-closed host-only replay and exact Python analyzer
        shell: bash
        env:
          STANDARD: ${{ matrix.standard }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then cxx=clang++; else cxx=g++; fi
          cd Tools/AssemblyShadow/R03IR/TypeDefCensus
          for profile in strict sanitizer; do
            if [[ "$profile" == sanitizer ]]; then
              "$cxx" -std="$STANDARD" -O1 -g -Wall -Wextra -Werror -pedantic \
                -fsanitize=address,undefined -fno-omit-frame-pointer \
                TypeDefSourceCoverageReplayHost.cpp -o "$RUNNER_TEMP/coverage-replay"
            else
              "$cxx" -std="$STANDARD" -O2 -Wall -Wextra -Werror -pedantic \
                TypeDefSourceCoverageReplayHost.cpp -o "$RUNNER_TEMP/coverage-replay"
            fi
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
              UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              "$RUNNER_TEMP/coverage-replay" > "$RUNNER_TEMP/result.json"
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
              UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              "$RUNNER_TEMP/coverage-replay" --fixture > "$RUNNER_TEMP/complete.json"
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
              UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              "$RUNNER_TEMP/coverage-replay" --incomplete-fixture > "$RUNNER_TEMP/incomplete.json"
            python3 analyze_typedef_census.py --input "$RUNNER_TEMP/complete.json" \
              --output "$RUNNER_TEMP/complete-analysis.json"
            python3 analyze_typedef_census.py --input "$RUNNER_TEMP/incomplete.json" \
              --output "$RUNNER_TEMP/incomplete-analysis.json"
            python3 - "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/complete-analysis.json" "$RUNNER_TEMP/incomplete-analysis.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: r=json.load(f)
          assert r['kind']=='R03B2TypeDefSourceCoverageReplayHost'
          assert r['status']=='PassedSyntheticOnly'
          assert r['cases']>=9 and r['checks']>=3218
          assert r['realUnity'] is False and r['nativeIntegrated'] is False
          assert r['fullSourceProven'] is False and r['R03Accepted'] is False
          with open(sys.argv[2],encoding='utf-8') as f: good=json.load(f)
          with open(sys.argv[3],encoding='utf-8') as f: incomplete=json.load(f)
          for result in (good,incomplete):
              assert result['captureKind']=='UnverifiedSource'
              assert result['distinctTypeDefs']=={
                  'union':2,'roots':1,'nonroots':2,'sharedBothRoles':1}
              assert result['capacityObservations']['capacityDecisionAuthorized'] is False
              assert not any(result['provenance'].values())
          assert good['analysisStatus']=='StructurallyCompleteUnverified'
          assert incomplete['analysisStatus']=='IncompleteLowerBound'
          assert incomplete['events']['dropped']>=1
          print('R03 B2 source path coverage replay synthetic-only PASS')
          PY
          done
