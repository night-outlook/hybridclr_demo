name: R03 LL checked source object staging
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths: ['.github/workflows/r03-ll-stage.yml', 'Tools/AssemblyShadow/R03LLStaging/**']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5f2d626b08985dac8f4833bb8ca0988b90e538c7
          path: candidate
          persist-credentials: false
      - name: Verify patch and stage content-addressed blobs only; no branch or commit writes
        shell: python
        env:
          STAGING_TOKEN: ${{ github.token }}
        run: |
          import base64,hashlib,json,os,subprocess,urllib.request,zlib
          from pathlib import Path
          root=Path('transport/Tools/AssemblyShadow/R03LLStaging')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['base']=='5f2d626b08985dac8f4833bb8ca0988b90e538c7'
          chunks=[(root/f'part{i}.txt').read_text().strip() for i in range(4)]
          # Exact transport typo correction; digest validation remains mandatory.
          chunks[0]=chunks[0].replace('OjtLJJoitJo','OjtLJoitJo')
          patch=zlib.decompress(base64.b64decode(''.join(chunks),validate=True))
          assert len(patch)==61181 and hashlib.sha256(patch).hexdigest()==manifest['patchSha256']
          subprocess.run(['git','-C','candidate','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','-C','candidate','apply','-'],input=patch,check=True)
          changes=subprocess.check_output(['git','-C','candidate','status','--porcelain=v1','--untracked-files=all']).decode().splitlines()
          assert {line[3:] for line in changes}==set(manifest['files']),changes
          out=Path(os.environ['RUNNER_TEMP'])/'staged';out.mkdir()
          rows=[]
          for name,sha256 in manifest['files'].items():
              path=Path('candidate')/name
              assert path.is_file() and not path.is_symlink() and '..' not in Path(name).parts
              data=path.read_bytes();assert hashlib.sha256(data).hexdigest()==sha256,name
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              url='https://api.github.com/repos/night-outlook/hybridclr_demo/git/blobs'
              request=urllib.request.Request(url,data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['STAGING_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response:actual=json.load(response)
              assert actual['sha']==expected,name
              target=out/'sources'/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              rows.append({'path':name,'sha':expected,'size':len(data),'sha256':sha256})
          extras=[
            'Docs/AssemblyShadow/History/M07R/R03/local-validation-20261001-batch-d-return-required/batch/editor-results.xml',
            'Docs/AssemblyShadow/History/M07R/R03/local-validation-20261003-batch-i-return-required/batch/focused-editor/results.xml',
            'Docs/AssemblyShadow/History/M07R/R03/local-validation-20261003-batch-i-return-required/preflight/issue-resource-snapshot/ProjectSettings/AssemblyShadowSourcePins.json']
          extra_rows=[]
          for name in extras:
              data=(Path('candidate')/name).read_bytes();target=out/'test-inputs'/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              extra_rows.append({'path':name,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data),'gitBlob':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()})
          (out/'staged.json').write_text(json.dumps({'kind':'VerifiedSourceObjectsOnly','source':os.environ['GITHUB_SHA'],'base':manifest['base'],'patchSha256':manifest['patchSha256'],'files':rows,'testInputs':extra_rows,'commitWritten':False,'refWritten':False,'validationAcceptance':False},indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r03-ll-staged-${{ github.sha }}
          path: ${{ runner.temp }}/staged
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
