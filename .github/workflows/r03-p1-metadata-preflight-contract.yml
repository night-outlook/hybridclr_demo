name: R03 P1 Local candidate source-preflight CLI guards
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - 'Tools/AssemblyShadow/R03IR/run_p1_metadata_local_preflight.py'
      - 'Tools/AssemblyShadow/R03IR/test_p1_metadata_preflight.py'
      - 'Tools/AssemblyShadow/R03/native_validation.py'
      - '.github/workflows/r03-p1-metadata-preflight-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-cli-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/run_p1_metadata_local_preflight.py
            Tools/AssemblyShadow/R03IR/test_p1_metadata_preflight.py
            Tools/AssemblyShadow/R03/native_validation.py
            Tools/AssemblyShadow/R03/batch_contract.py
            Tools/AssemblyShadow/R03/batch_evidence.py
            Tools/AssemblyShadow/R03/command_lifetime.py
          sparse-checkout-cone-mode: false
      - name: Static parser, source ownership and negative argument gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -B Tools/AssemblyShadow/R03IR/test_p1_metadata_preflight.py
