name: R03 native B1 four-repository exact-source host gate
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - '.github/workflows/r03-ir-native-b1-four-repo-source.yml'
      - 'Tools/AssemblyShadow/R03IR/current_native_candidate.json'
      - 'Tools/AssemblyShadow/R03IR/current_native_source_gate.py'
      - 'Tools/AssemblyShadow/R03IR/current_native_vm_delta.json'
      - 'Tools/AssemblyShadow/R03IR/current_native_vm_delta_contracts.py'
      - 'Docs/AssemblyShadow/Handoff/WEB_TO_LOCAL.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b1-exact-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tools/AssemblyShadow/R03/
            /Tools/AssemblyShadow/R03IR/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr
          ref: 4b2774b066cfc6afd77a8c8aded6bda7ea574f55
          path: pinned-hybridclr
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /hybridclr/interpreter/Interpreter_Execute.cpp
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_unity
          ref: 948c0e3b4f8891481301770115e8ba4945eea6de
          path: pinned-package
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/il2cpp_plus
          ref: a0209bf4285db3f0d0fc66d8817578235438cef4
          path: pinned-native
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /libil2cpp/vm/
      - name: Verify pinned four-repo source checkout and all 47 native VM paths
        shell: bash
        run: |
          set -euo pipefail
          demo="$PWD"; native="$PWD/pinned-native"
          interp="$PWD/pinned-hybridclr"; pkg="$PWD/pinned-package"
          python3 -B Tools/AssemblyShadow/R03IR/current_native_source_gate.py \
            --demo "$demo" --native "$native" --hybridclr "$interp" \
            --package "$pkg" --exact-checkout-heads
          python3 -B Tools/AssemblyShadow/R03IR/current_native_source_contracts.py \
            --demo "$demo" --native "$native" --hybridclr "$interp" \
            --package "$pkg"
          python3 -B Tools/AssemblyShadow/R03IR/current_native_vm_delta_contracts.py \
            --native "$native"
      - name: Verify B1 API declared and wired at actual native origin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          h=Path('pinned-native/libil2cpp/vm/AssemblyShadowFirstFailureV2.h').read_text()
          cpp=Path('pinned-native/libil2cpp/vm/AssemblyShadow.cpp').read_text()
          iface=Path('pinned-native/libil2cpp/vm/AssemblyShadow.h').read_text()
          for n in ('bool TryFreeze(', 'bool Read(', 'ValidUtf8('):
              assert n in h,n
          for n in ('Origin::InterpreterInitializer', 'Origin::LateBaselineUse',
                    'Origin::ReferenceViolation', 'Origin::UnexpectedFailure',
                    'AssemblyShadow::TryReadFirstFailureV2', 'RecordFirstGuardFailure('):
              assert n in cpp,n
          assert 'static bool TryReadFirstFailureV2(' in iface
          print('B1 authenticated native source (not Unity/native SDK build).')
          PY
