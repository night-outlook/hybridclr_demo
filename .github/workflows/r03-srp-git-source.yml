name: R03 pinned upstream SRP source metadata
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths: ['.github/workflows/r03-srp-git-source.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Unity-Technologies/Graphics
          ref: 03ca85dffdde4b7bc1d6870074e6f5ff9f0352a3
          persist-credentials: false
          sparse-checkout: |
            Packages/com.unity.render-pipelines.core/Runtime
            Packages/com.unity.render-pipelines.core/package.json
          sparse-checkout-cone-mode: false
      - name: Capture official C-sharp compiler inputs without claiming UPM byte equivalence
        shell: python
        run: |
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();assert sha=='03ca85dffdde4b7bc1d6870074e6f5ff9f0352a3'
          base=Path('Packages/com.unity.render-pipelines.core');metadata=json.loads((base/'package.json').read_text())
          assert metadata['version']=='14.0.12' and metadata['name']=='com.unity.render-pipelines.core'
          out=Path(os.environ['RUNNER_TEMP'])/'r03-srp-git-source';out.mkdir();rows=[]
          for p in sorted(base.rglob('*')):
              if not p.is_file() or p.suffix not in ('.cs','.asmdef','.asmref','.meta','.json'):continue
              target=out/p;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,target)
              data=p.read_bytes();rows.append({'path':str(p),'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'blob':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()})
          (out/'provenance.json').write_text(json.dumps({'kind':'PinnedOfficialCoreRpSource','repository':'Unity-Technologies/Graphics','revision':sha,'packageVersion':'14.0.12','files':rows,'use':'Compile-time dependency; actual Local UPM bytes remain independently bound by Player build receipts','upmArchiveByteEquivalenceClaimed':False,'unityRun':False,'playerRun':False},indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r03-srp-git-source-${{ github.sha }}
          path: ${{ runner.temp }}/r03-srp-git-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
