name: R03 initializer source-derived managed-to-native Bi4 bridge contracts
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - '.github/workflows/r03-ir-initializer-bridge-host.yml'
      - 'Tools/AssemblyShadow/R03IR/BridgeHost/**'
      - 'Tools/AssemblyShadow/R03IR/bridge_host_contracts.py'
      - 'Tools/AssemblyShadow/R03IR/PlayerProject/R03InitializerBridge.cs'
      - 'Tools/AssemblyShadow/R03IR/prepare_initializer_sources.py'
      - 'Tools/AssemblyShadow/R03IR/PlayerProject/R03InitializerPreparedProbe.cpp'
      - 'Tools/AssemblyShadow/R03/PlayerProject/R03Build.cs'
      - 'Docs/AssemblyShadow/Handoff/WEB_TO_LOCAL.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-host-bridge:
    name: Actual dnlib fixture, CSharp bridge and native Cdecl invocation / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hybridclr_demo
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tools/AssemblyShadow/R03/PlayerFixtures/
            /Tools/AssemblyShadow/R03/Fixtures/EvolutionFixtureCorpus.cs
            /Tools/AssemblyShadow/R03/HostTests/EnvironmentBoundaries.cs
            /Tools/AssemblyShadow/R03IR/PlayerProject/R03InitializerBridge.cs
            /Tools/AssemblyShadow/R03IR/BridgeHost/
            /Tools/AssemblyShadow/R03IR/bridge_host_contracts.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_unity
          ref: 948c0e3b4f8891481301770115e8ba4945eea6de
          path: hybridclr_unity
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Plugins/dnlib.dll
            /Editor/AssemblyShadow/Model/ShadowConfiguration.cs
            /Editor/AssemblyShadow/Metadata/AssemblyIdentityUtil.cs
            /Editor/AssemblyShadow/Metadata/EvolutionSignature.cs
            /Editor/AssemblyShadow/Metadata/LogicalMethodIdentity.cs
            /Editor/AssemblyShadow/Metadata/NativeLayoutAdmissionValidator.cs
            /Editor/AssemblyShadow/Metadata/NativeLayoutIdentityContext.cs
            /Editor/AssemblyShadow/Hashing/CanonicalSignatureWriter.cs
            /Tests/Editor/AssemblyShadow/R03EvolutionContractCases.cs
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr
          ref: 4b2774b066cfc6afd77a8c8aded6bda7ea574f55
          path: hybridclr
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /hybridclr/generated/MethodBridge.cpp
            /hybridclr/interpreter/MethodBridge.h
            /hybridclr/interpreter/InterpreterModule.cpp
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.318'
      - name: Authenticate exact source authority and build real generator plus CSharp helper
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          test "$(git -C hybridclr_demo rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C hybridclr_unity rev-parse HEAD)" = 948c0e3b4f8891481301770115e8ba4945eea6de
          test "$(git -C hybridclr rev-parse HEAD)" = 4b2774b066cfc6afd77a8c8aded6bda7ea574f55
          tmp="$RUNNER_TEMP/r03-init-bi4"
          mkdir -p "$tmp"
          dotnet build hybridclr_demo/Tools/AssemblyShadow/R03/PlayerFixtures/PlayerFixtures.csproj \
            -c Release -v minimal \
            -p:PackageRoot="$GITHUB_WORKSPACE/hybridclr_unity" \
            -p:BaseIntermediateOutputPath="$tmp/fixtures-obj/" \
            -p:OutputPath="$tmp/fixtures-bin/" \
            --disable-build-servers -p:UseSharedCompilation=false -nodeReuse:false \
            > "$tmp/fixtures-compile.log" 2>&1
          dotnet build hybridclr_demo/Tools/AssemblyShadow/R03IR/BridgeHost/BridgeHost.csproj \
            -c Release -v minimal \
            -p:PackageRoot="$GITHUB_WORKSPACE/hybridclr_unity" \
            -p:BaseIntermediateOutputPath="$tmp/bridge-obj/" \
            -p:OutputPath="$tmp/bridge-bin/" \
            --disable-build-servers -p:UseSharedCompilation=false -nodeReuse:false \
            > "$tmp/bridge-compile.log" 2>&1
          dotnet "$tmp/fixtures-bin/PlayerFixtures.dll" \
            --ir-terminal-native-targets "$tmp/fixture" > "$tmp/fixture-report.stdout"
          test -s "$tmp/fixture/initializer-native-targets.json"
          mkdir -p "$tmp/native/hybridclr/generated"
          cp hybridclr/hybridclr/generated/MethodBridge.cpp \
             "$tmp/native/hybridclr/generated/MethodBridge.cpp"
      - name: Execute real CSharp source bridge against both independently pinned V2 DLLs
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r03-init-bi4"
          dotnet "$tmp/bridge-bin/BridgeHost.dll" \
            "$tmp/fixture/native/initializer-control/Methods.dll" \
            d6e5b66f695498a9ba0806ea81930f03804d98f77382cb851d24c2b24f24202e \
            5bb6e17a-09b9-5b29-dac2-41d3519f76f4 \
            "$tmp/fixture/native/initializer-failure/Methods.dll" \
            6ad097153da2054579c13ec48d9f81a35d2551b08bf7a77398f13809ef9e5370 \
            f61d7325-6d38-4640-5873-37371f587b16 \
            valid "$tmp/native" "$tmp/bridge-receipt.json"
          python3 -B hybridclr_demo/Tools/AssemblyShadow/R03IR/bridge_host_contracts.py \
            --bridge "$tmp/native/hybridclr/generated/MethodBridge.cpp"
      - name: Negative cases never relabel or change an already generated bridge
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r03-init-bi4"
          bridge="$tmp/native/hybridclr/generated/MethodBridge.cpp"
          before="$(shasum -a 256 "$bridge" | awk '{print $1}')"
          set +e
          dotnet "$tmp/bridge-bin/BridgeHost.dll" \
            "$tmp/fixture/native/initializer-control/Methods.dll" \
            d6e5b66f695498a9ba0806ea81930f03804d98f77382cb851d24c2b24f24202e \
            5bb6e17a-09b9-5b29-dac2-41d3519f76f4 \
            "$tmp/fixture/native/initializer-failure/Methods.dll" \
            6ad097153da2054579c13ec48d9f81a35d2551b08bf7a77398f13809ef9e5370 \
            f61d7325-6d38-4640-5873-37371f587b16 \
            valid "$tmp/native" "$tmp/invalid-repeat.json" \
            > "$tmp/repeat.log" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          test ! -f "$tmp/invalid-repeat.json"
          test "$(shasum -a 256 "$bridge" | awk '{print $1}')" = "$before"
          echo 'Source-only: no Unity Player, no general bridge replacement, no R03 acceptance'
