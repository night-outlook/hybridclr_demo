name: R03 B2 pinned native TypeDef source path boundary (NOT Unity)
on:
  push:
    branches:
      - codex/assembly-shadow-r01b-h1
    paths:
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_native_source_path_boundary.py
      - Tools/AssemblyShadow/R03IR/TypeDefCensus/test_verify_native_source_path_boundary.py
      - .github/workflows/r03-b2-native-source-path-boundary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-source-boundary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/TypeDefCensus
          sparse-checkout-cone-mode: true
      - name: Checkout exact read-only native source pin (not a build)
        uses: actions/checkout@v4
        with:
          repository: night-outlook/il2cpp_plus
          ref: cecf4b859d50b128e5c0fc6c90cd89e3a452b96a
          path: _native_pinned
          filter: blob:none
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadowBoundedDefinitionExecutionLiveSource.inl
            libil2cpp/vm/AssemblyShadowOriginalV1OwnerJoin.h
            libil2cpp/vm/AssemblyShadowMetadataLifetime.h
            libil2cpp/vm/AssemblyShadowBoundedDefinitionExecutionLive.h
          sparse-checkout-cone-mode: false
      - name: Source-path and rejected-before-owner boundary audit
        shell: bash
        env:
          R03_B2_PINNED_NATIVE_ROOT: _native_pinned
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Tools/AssemblyShadow/R03IR/TypeDefCensus \
            -p 'test_verify_native_source_path_boundary.py' -v
          python3 Tools/AssemblyShadow/R03IR/TypeDefCensus/verify_native_source_path_boundary.py \
            --native-root _native_pinned --output "$RUNNER_TEMP/b2-source-boundary.json"
          python3 - "$RUNNER_TEMP/b2-source-boundary.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: report=json.load(f)
          assert report['result']=='PinnedStaticBoundaryOnly'
          assert report['nativeCommit']=='cecf4b859d50b128e5c0fc6c90cd89e3a452b96a'
          assert report['nativeSourceGitBlob']=='f988e8a3ebaefe13dde80fa2cb784a673326f395'
          assert len(report['staticPathLabels'])==6
          assert len(report['preOwnerOrPreCoverageRejectionBoundaries'])==7
          assert report['physicalClassPasses']==3 and report['originalV1ImagePasses']==2
          assert report['nativeCombinedTypeDefLimit']==128
          assert report['nativeIndexedLookupLimit']==65536
          assert report['nativePerNameFieldLimit']==64
          assert report['originalFirstOwnerBefore128Audit'] is True
          for field in ('producerIntegrated','allRealTypeDefPathsDiscovered',
                        'rejectedPathsObservedByNativeCensus',
                        'metadataLifetimeIndependentlyProven',
                        'classGcVmEpochProven','realUnityPlayerEvidence',
                        'R03Accepted','H2Passed','ReadyForHumanReviewGate'):
              assert report[field] is False, field
          assert report['handoffAuthority']=='CLOSED_NO_LOCAL_EXECUTION'
          print('exact pinned source boundary only, NOT Unity acceptance')
          PY
